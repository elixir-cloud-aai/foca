# Source: petstore/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "petstore"
  labels:
    helm.sh/chart: petstore-0.1.0
    app.kubernetes.io/name: "petstore"
    app.kubernetes.io/instance: "petstore"
    app.kubernetes.io/component: "app"
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: Helm
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: "petstore"
      app.kubernetes.io/instance: "petstore"
      app.kubernetes.io/component: "app"
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        # Roll the pods when the config changes
        checksum/config: bebfb7de27db01df27e986a7b47e867ae8d05f29e4ea117c14a0f4c82bf8c49e
      labels:
        app.kubernetes.io/name: "petstore"
        app.kubernetes.io/instance: "petstore"
        app.kubernetes.io/component: "app"
    spec:
      # The pod doesn't call the Kubernetes API
      automountServiceAccountToken: false
      # No `<SERVICE>_PORT` etc. variables of the Services in the namespace:
      # FOCA reads some as configuration (e.g., `MONGO_PORT` of a Service
      # `mongo`, which isn't a port)
      enableServiceLinks: false
      containers:
      - image: "foca-petstore:latest"
        imagePullPolicy: IfNotPresent
        name: petstore
        env:
        - name: FOCA_CONFIG_OVERLAY
          value: /etc/petstore/overlay.yaml
        # Settings of Gunicorn (the image's command), overriding the image's
        # defaults; options are split like shell words, so `extraArgs` are
        # quoted
        - name: GUNICORN_CMD_ARGS
          value: "--workers 1 --threads 4 --timeout 30 --graceful-timeout 20 --keep-alive 75"
        - name: MONGO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: "mongodb-credentials"
              key: password
        - name: MONGO_USERNAME
          valueFrom:
            secretKeyRef:
              name: "mongodb-credentials"
              key: username
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        # Probes request `petstore.probePath`, e.g., the Swagger UI
        # (no authentication, no database access)
        # Up to 5 minutes are allowed for the start before liveness checks
        startupProbe:
          httpGet:
            path: "/openapi.json"
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: "/openapi.json"
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: "/openapi.json"
            port: 8080
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        # Keep serving until the ingress controller and Service have removed
        # the pod from their endpoints, as Gunicorn stops accepting
        # connections on SIGTERM (Python, as the image need not have `sleep`)
        lifecycle:
          preStop:
            exec:
              command: ["python", "-c", "import time; time.sleep(5)"]
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /etc/petstore
          name: config
          readOnly: true
        # Writable, as the root file system is read-only by default (e.g., for
        # temporary files of uploads), up to `petstore.tmpSizeLimit`
        - mountPath: /tmp
          name: tmp
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 35
      volumes:
      - configMap:
          name: "petstore-config"
        name: config
      - name: tmp
        emptyDir:
          sizeLimit: "64Mi"
---
# Source: petstore/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "petstore"
  labels:
    helm.sh/chart: petstore-0.1.0
    app.kubernetes.io/name: "petstore"
    app.kubernetes.io/instance: "petstore"
    app.kubernetes.io/component: "app"
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: Helm
spec:
  rules:
  - host: "petstore.example.org"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: "petstore"
            port:
              name: http
