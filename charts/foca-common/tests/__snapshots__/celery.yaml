apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: "petstore-broker"
  labels:
    helm.sh/chart: petstore-0.1.0
    app.kubernetes.io/name: "petstore"
    app.kubernetes.io/instance: "petstore"
    app.kubernetes.io/component: "broker"
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  revisionHistoryLimit: 10
  # The broker's Service (the pod's DNS name is not used)
  serviceName: "petstore-broker"
  selector:
    matchLabels:
      app.kubernetes.io/name: "petstore"
      app.kubernetes.io/instance: "petstore"
      app.kubernetes.io/component: "broker"
  # Replaces the pod on changes only after the old one is gone
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      annotations:
        # Restart RabbitMQ when its config changes
        checksum/config: c9327e83eba8207c2105684a0653fdb196f5ef3b3e46cc21c3464d016474e188
      labels:
        app.kubernetes.io/name: "petstore"
        app.kubernetes.io/instance: "petstore"
        app.kubernetes.io/component: "broker"
    spec:
      # The pod doesn't call the Kubernetes API
      automountServiceAccountToken: false
      # No `<SERVICE>_PORT` etc. variables of the Services in the namespace
      # (RabbitMQ reads `RABBITMQ_*` variables as configuration)
      enableServiceLinks: false
      containers:
      - image: docker.io/library/rabbitmq:4.3.7
        imagePullPolicy: IfNotPresent
        name: broker
        env:
        # Logs to standard output only, as the root file system is read-only
        - name: RABBITMQ_LOGS
          value: "-"
        # Fixed, as RabbitMQ keeps its data in a directory named after it;
        # never change it, as existing data would be ignored
        - name: RABBITMQ_NODENAME
          value: rabbit@localhost
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              name: "celery"
              key: username
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: "celery"
              key: password
        # TCP checks are cheaper than starting `rabbitmq-diagnostics`;
        # RabbitMQ accepts AMQP connections once it has booted
        startupProbe:
          tcpSocket:
            port: 5672
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: 5672
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 5672
          periodSeconds: 20
        ports:
        - name: amqp
          containerPort: 5672
          protocol: TCP
        resources:
          limits:
            cpu: 200m
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        # RabbitMQ's home (with the Erlang cookie) and, without persistence,
        # its data
        - mountPath: /var/lib/rabbitmq
          name: data
        # RabbitMQ's data, on the claim
        - mountPath: /var/lib/rabbitmq/mnesia
          name: persistent-data
        # Writable, as the root file system is read-only by default
        - mountPath: /tmp
          name: tmp
        # Added to the image's config files
        - mountPath: /etc/rabbitmq/conf.d/90-foca.conf
          name: config
          subPath: 90-foca.conf
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 999
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - name: data
        emptyDir:
          sizeLimit: "1Gi"
      - name: persistent-data
        persistentVolumeClaim:
          claimName: "petstore-broker"
      - name: tmp
        emptyDir:
          sizeLimit: "64Mi"
      - name: config
        configMap:
          name: "petstore-broker-config"
