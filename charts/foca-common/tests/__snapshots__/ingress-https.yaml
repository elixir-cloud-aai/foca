apiVersion: v1
kind: ConfigMap
metadata:
  name: "petstore-mongodb-init-script"
  labels:
    helm.sh/chart: petstore-0.1.0
    app.kubernetes.io/name: "petstore"
    app.kubernetes.io/instance: "petstore"
    app.kubernetes.io/component: "mongodb"
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: Helm
data:
  create-app-user.js: |
    // Create the app user with access to the app's databases only; FOCA puts
    // the first database in the connection string, so the app authenticates
    // against it.
    db.getSiblingDB('petstore').createUser({
      user: process.env.MONGO_APP_USERNAME,
      pwd: process.env.MONGO_APP_PASSWORD,
      roles: [{ role: 'readWrite', db: 'petstore' }],
    });
