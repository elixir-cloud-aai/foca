# Source: petstore/templates/mongodb-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "petstore-mongodb"
  labels:
    helm.sh/chart: petstore-0.1.0
    app.kubernetes.io/name: "petstore"
    app.kubernetes.io/instance: "petstore"
    app.kubernetes.io/component: "mongodb"
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: Helm
spec:
  # Longer than the startup window (see `startupProbe`)
  progressDeadlineSeconds: 2400
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: "petstore"
      app.kubernetes.io/instance: "petstore"
      app.kubernetes.io/component: "mongodb"
  # The data volume can only be used by one pod at a time
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: "petstore"
        app.kubernetes.io/instance: "petstore"
        app.kubernetes.io/component: "mongodb"
    spec:
      # The pod doesn't call the Kubernetes API
      automountServiceAccountToken: false
      # No `<SERVICE>_PORT` etc. variables of the Services in the namespace
      enableServiceLinks: false
      containers:
      - image: docker.io/library/mongo:7.0
        imagePullPolicy: Always
        name: mongodb
        env:
        - name: MONGO_APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: "mongodb-credentials"
              key: password
        - name: MONGO_APP_USERNAME
          valueFrom:
            secretKeyRef:
              name: "mongodb-credentials"
              key: username
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: "mongodb-credentials"
              key: root-password
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: "mongodb-credentials"
              key: root-username
        # TCP checks are cheaper than starting `mongosh` within the CPU limit.
        # MongoDB listens on localhost only while initializing an empty data
        # directory, and recovery after an unclean shutdown can take a while,
        # so allow up to 30 minutes before liveness checks start, as
        # interrupting the initialization skips it on the next start
        startupProbe:
          tcpSocket:
            port: 27017
          periodSeconds: 10
          failureThreshold: 180
        readinessProbe:
          tcpSocket:
            port: 27017
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 27017
          periodSeconds: 20
        ports:
        - name: mongodb
          containerPort: 27017
          protocol: TCP
        resources:
          limits:
            cpu: 200m
            memory: 512Mi
          requests:
            cpu: 200m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /data/db
          name: mongodb
        # Writable, as the root file system is read-only by default: the
        # socket and the files of the entrypoint's first start (`/tmp`) and
        # the config database directory declared by the image
        - mountPath: /tmp
          name: tmp
        - mountPath: /data/configdb
          name: configdb
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 999
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - name: mongodb
        persistentVolumeClaim:
          claimName: "petstore-mongodb"
      - name: tmp
        emptyDir:
          sizeLimit: "64Mi"
      - name: configdb
        emptyDir: {}
      - name: init-script
        configMap:
          name: "petstore-mongodb-init-script"
