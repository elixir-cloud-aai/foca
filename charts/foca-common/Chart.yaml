apiVersion: v2
name: foca-common
description: >-
  Library chart for FOCA apps by ELIXIR On-Cloud: the app's Deployment,
  config overlay, Service, Ingress or OpenShift Route and NetworkPolicy, an
  optional MongoDB, and an optional Celery worker and broker (RabbitMQ)
type: library
# Independent of FOCA's version; bump it with every change, following
# semantic versioning (see docs/helm-chart.md)
version: 0.1.0
home: https://foca.readthedocs.io/en/latest/helm-chart/
icon: https://raw.githubusercontent.com/elixir-cloud-aai/foca/dev/docs/images/foca_logo_round.svg
sources:
  - https://github.com/elixir-cloud-aai/foca/tree/dev/charts/foca-common
keywords:
  - foca
  - flask
  - connexion
  - mongodb
  - celery
  - rabbitmq
  - elixir
maintainers:
  - name: ELIXIR On-Cloud
    url: https://github.com/elixir-cloud-aai
