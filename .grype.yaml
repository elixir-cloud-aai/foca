# Grype configuration for the image scans (`.github/workflows/images.yml`).
#
# Accepted vulnerabilities: add a rule only if a finding does not affect FOCA
# or cannot be fixed yet (e.g., no fixed base image), never to make CI pass.
# Every rule needs a `reason` (why it is accepted; link the evidence) and an
# `expires` date (YYYY-MM-DD, at most three months ahead), after which the
# scan fails until the rule is reviewed and removed or renewed. Grype does not
# know `expires`; the `ignores` job of the scan workflow checks it. Match as
# narrowly as possible, e.g., by vulnerability and package:
#
#   - vulnerability: CVE-2026-12345
#     package:
#       name: libexample
#     reason: "Only exploitable via the example CLI, which FOCA does not run"
#     expires: "2027-01-31"
#
# See https://github.com/anchore/grype#specifying-matches-to-ignore for the
# fields of a rule.
ignore: []
