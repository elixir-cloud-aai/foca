id: flask-import
language: python
severity: warning
message: Flask, Werkzeug or Connexion request import, removed in the ASGI release
note: |
  The ASGI release of FOCA (Connexion 3) removes Flask, and Werkzeug and
  Connexion's request objects are no longer part of the API. Use what FOCA
  0.22 already provides on Connexion 2:
  - request data: `foca.context.current_request()`; token info and claims:
    `current_token_info()` and `current_claims()` of `foca.security.auth`
  - exceptions: `foca.errors` (e.g., `NotFound`, `BadRequest`)
  - tests: `foca.testing` (`Client`, `request_context`, pytest fixtures)
  - configuration: `foca.get_config()`, not `current_app.config`
  - responses: return `body`, `(body, status)` or
    `(body, status, headers)` tuples, not `make_response()` or `Response`
  Werkzeug stays installed but isn't imported. Severity `warning` from FOCA
  0.22, `error` from the ASGI release. See "Finding Flask imports" in the
  FOCA docs (migration to 0.22).
# Shared with FOCA apps, which scope it to their package (`<pkg>/**`); in
# FOCA, it covers the examples. `flask-import-tests.yml` has the same rule
# for the tests, `no-new-flask-internals.yml` for FOCA's own package.
files:
  - examples/**
rule:
  any:
    - kind: import_statement
      has:
        kind: dotted_name
        regex: ^(flask|flask_cors|werkzeug|connexion\.(context|request))(\.|$)
        stopBy: end
    - kind: import_from_statement
      has:
        field: module_name
        regex: ^(flask|flask_cors|werkzeug|connexion\.(context|request))(\.|$)
    - kind: import_from_statement
      all:
        - has:
            field: module_name
            regex: ^connexion$
        - has:
            kind: dotted_name
            regex: ^(context|request)$
            stopBy: end
    - pattern: connexion.request
    - pattern: connexion.context
