id: flask-import-tests
language: python
severity: warning
message: Flask, Werkzeug or Connexion request import, removed in the ASGI release
note: |
  The ASGI release of FOCA (Connexion 3) removes Flask, and Flask's test
  client and request contexts with it. Use `foca.testing` (`Client`,
  `request_context`, the `foca_app` and `foca_client` pytest fixtures) and
  the replacements listed for `flask-import`. Severity `warning` from FOCA
  0.22, `error` from the ASGI release.
# Same rule as `flask-import`, for the tests. Apps scope it to `tests/**`;
# FOCA's own tests exercise Flask on purpose, so here it only covers tests
# of the examples.
files:
  - examples/*/tests/**
rule:
  any:
    - kind: import_statement
      has:
        kind: dotted_name
        regex: ^(flask|flask_cors|werkzeug|connexion\.(context|request))(\.|$)
        stopBy: end
    - kind: import_from_statement
      has:
        field: module_name
        regex: ^(flask|flask_cors|werkzeug|connexion\.(context|request))(\.|$)
    - kind: import_from_statement
      all:
        - has:
            field: module_name
            regex: ^connexion$
        - has:
            kind: dotted_name
            regex: ^(context|request)$
            stopBy: end
    - pattern: connexion.request
    - pattern: connexion.context
