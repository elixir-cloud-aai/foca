# FOCA CONFIGURATION

# Available in apps via `foca.get_config()`
# Automatically validated via FOCA
# Cf. https://foca.readthedocs.io/en/latest/configuration/
# Relative file paths are resolved against the directory of this file
# Environment-specific overlays (e.g., `config.prod.yaml`) can be merged into
# this file via environment variable `FOCA_CONFIG_OVERLAY`

# SERVER CONFIGURATION
# Cf. https://foca.readthedocs.io/en/latest/configuration/server/
server:
  host: '0.0.0.0'
  port: 8080
  # Debug mode exposes an interactive debugger; local development only
  debug: False
  testing: False

# EXCEPTION CONFIGURATION
# Cf. https://foca.readthedocs.io/en/latest/configuration/exceptions/
exceptions:
  mapping: my_app.exceptions.problems
  public_members: null
  logging: oneline

# SECURITY CONFIGURATION
# Cf. https://foca.readthedocs.io/en/latest/configuration/auth/
security:
  auth:
    add_key_to_claims: True
    algorithms:
      - RS256
    allow_expired: False
    audience: null
    # Trusted token issuers (`iss` claim); tokens of other issuers are
    # rejected
    issuers:
      - https://login.example.org/oidc/

# API CONFIGURATION
# Cf. https://foca.readthedocs.io/en/latest/configuration/api/
api:
  specs:
    - path:
        - path/to/my/openapi/specs.yaml
      add_operation_fields:
        x-openapi-router-controller: myapi.controllers
      add_security_fields:
        x-bearerInfoFunc: app.validate_token
      disable_auth: False
      connexion:
        strict_validation: True
        validate_responses: True
        options:
          swagger_ui: True
          serve_spec: True

# DATABASE CONFIGURATION
# Cf. https://foca.readthedocs.io/en/latest/configuration/db/
db:
  host: mongodb
  port: 27017
  dbs:
    myDb:
      collections:
        myCollection:
          indexes:
            - keys:
                id: 1
              options:
                'unique': True

# WORKER CONFIGURATION
# Cf. https://foca.readthedocs.io/en/latest/configuration/jobs/
jobs:
  host: rabbitmq
  port: 5672
  backend: 'rpc://'
  include:
    - my_app.tasks.my_task_1
    - my_app.tasks.my_task_2

# LOGGING CONFIGURATION
# Cf. https://foca.readthedocs.io/en/latest/configuration/log/
log:
  version: 1
  disable_existing_loggers: False
  formatters:
    standard:
      class: logging.Formatter
      style: "{"
      format: "[{asctime}: {levelname:<8}] {message} [{name}]"
  handlers:
    console:
      class: logging.StreamHandler
      level: 20
      formatter: standard
      stream: ext://sys.stderr
  root:
    level: 10
    handlers: [console]


# CUSTOM APP CONFIGURATION
# Available in apps via `foca.get_config()`

# Can be validated by FOCA by passing a Pydantic model class to the
# `custom_config_model` parameter in the `foca.Foca()` constructor
custom:
  my_param: 'some_value'

# Any other sections/parameters are *not* validated by FOCA; if desired,
# validate parameters in app
custom_params_not_validated:
  my_other_param: 'some_other_value'
