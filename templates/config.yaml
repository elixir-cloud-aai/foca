# FOCA CONFIGURATION

# Available in apps via `foca.get_config()`
# Automatically validated via FOCA
# Cf. https://foca.readthedocs.io/en/latest/configuration/
# Relative file paths are resolved against the directory of this file
# Environment-specific overlays (e.g., `config.prod.yaml`) can be merged into
# this file via environment variable `FOCA_CONFIG_OVERLAY`

# SERVER CONFIGURATION
# Cf. https://foca.readthedocs.io/en/latest/configuration/server/
server:
  host: '0.0.0.0'
  port: 8080
  # Debug mode exposes an interactive debugger; local development only
  debug: False
  testing: False
  # Maximum size of request bodies in bytes (e.g., 10485760 for 10 MiB);
  # unlimited if null; bodies may be read before authentication
  max_content_length: null
  # URL of the app as clients see it, with any path prefix of a reverse
  # proxy (e.g., https://api.example.org/my-app/); none if null
  public_url: null

# EXCEPTION CONFIGURATION
# Cf. https://foca.readthedocs.io/en/latest/configuration/exceptions/
exceptions:
  mapping: my_app.exceptions.problems
  public_members: null
  logging: oneline
  # `application/json` if your specs declare it for errors (cf. docs)
  media_type: application/problem+json
  # Serve the reasons of request validation errors as `detail` (cf. docs)
  validation_details: True
  # Maximum length of request-specific details (longer ones are shortened)
  max_detail_length: 500

# SECURITY CONFIGURATION
# Cf. https://foca.readthedocs.io/en/latest/configuration/auth/
security:
  auth:
    add_key_to_claims: True
    algorithms:
      - RS256
    allow_expired: False
    # Audiences of the app (`aud` claim, e.g., its client ID at the
    # issuers); required if `issuers` are set, unless audience validation
    # is disabled with `verify_audience: False` (not recommended, unless
    # `clients` are restricted instead)
    audience:
      - my-app
    # Trusted token issuers (`iss` claim); tokens of other issuers are
    # rejected
    issuers:
      - https://login.example.org/oidc/
    # Accepted token types (`typ` header); by default, only OAuth 2.0 access
    # tokens as per RFC 9068, so that other JWTs (e.g., ID tokens) are
    # rejected; set `verify_token_type: False` only if the issuers do not
    # set the `typ` header of their access tokens (not recommended)
    token_types:
      - at+jwt
      - application/at+jwt
    # Accepted clients (`client_id` or `azp` claim), e.g., a gateway in front
    # of the app; usable in addition to `audience` or, with
    # `verify_audience: False`, instead of it; `null` accepts any client
    clients: null
    # Clients calling the app with client-credentials tokens of their own
    # (service tokens; no user info is requested for them); check which
    # subject (`claim_identity`) the issuer puts into their tokens and set
    # `subject` if it is not the client ID; set the `issuer` of each client
    # (required with several trusted `issuers`)
    service_clients: []
    # Request header in which service clients with `on_behalf_of: True`
    # name the user they act for
    on_behalf_of_header: null
  # Cf. https://foca.readthedocs.io/en/latest/configuration/access-control/
  access_control:
    # Requires trusted `issuers`; all other access control options require
    # `enabled: True`
    enabled: False
    # Refuse to start if no group (`group_mapping`, with `claim_groups`
    # set) or service client (`client_mapping`) is mapped to the role
    # `admin` and no rule of `policies` grants it, instead of logging a
    # warning
    require_admin: False

# API CONFIGURATION
# Cf. https://foca.readthedocs.io/en/latest/configuration/api/
api:
  # Named specs (a list works, too), so that config overlays can change a
  # single spec by its name, e.g., add `patches` (deep-merged into the spec)
  specs:
    my-api:
      path:
        - path/to/my/openapi/specs.yaml
      add_operation_fields:
        x-openapi-router-controller: myapi.controllers
      add_security_fields:
        x-bearerInfoFunc: app.validate_token
      disable_auth: False
      connexion:
        strict_validation: True
        validate_responses: True
        options:
          swagger_ui: True
          serve_spec: True

# DATABASE CONFIGURATION
# Cf. https://foca.readthedocs.io/en/latest/configuration/db/
db:
  host: mongodb
  port: 27017
  dbs:
    myDb:
      collections:
        myCollection:
          indexes:
            - keys:
                id: 1
              options:
                'unique': True

# WORKER CONFIGURATION
# Cf. https://foca.readthedocs.io/en/latest/configuration/jobs/
jobs:
  host: rabbitmq
  port: 5672
  backend: 'rpc://'
  include:
    - my_app.tasks.my_task_1
    - my_app.tasks.my_task_2

# LOGGING CONFIGURATION
# Cf. https://foca.readthedocs.io/en/latest/configuration/log/
log:
  version: 1
  disable_existing_loggers: False
  formatters:
    standard:
      class: logging.Formatter
      style: "{"
      format: "[{asctime}: {levelname:<8}] {message} [{name}]"
  handlers:
    console:
      class: logging.StreamHandler
      level: 20
      formatter: standard
      stream: ext://sys.stderr
  root:
    level: 10
    handlers: [console]

# SERVICE INFO CONFIGURATION
# Cf. https://foca.readthedocs.io/en/latest/configuration/service-info/
# Served by `foca.api.service_info.getServiceInfo` (route `GET /service-info`
# of your specs there); validated against the GA4GH `Service` schema
service_info:
  # Distribution package whose version is served, unless `service.version`
  # is set (optional; the package must be installed)
  # package: my-app
  # Function returning fields computed at runtime (optional; must be
  # importable)
  # runtime_fields: my_app.service_info.runtime_fields
  # Log requests and responses (default: True)
  # log_traffic: False
  service:
    id: org.example.my-service
    name: My service
    type:
      group: org.ga4gh
      artifact: wes
      version: 1.1.0
    description: Runs workflows.
    organization:
      name: Example
      url: https://example.org
    contactUrl: mailto:support@example.org
    documentationUrl: https://docs.example.org
    environment: prod
    # Remove if served from `package`
    version: 1.0.0


# CUSTOM APP CONFIGURATION
# Available in apps via `foca.get_config()`

# Can be validated by FOCA by passing a Pydantic model class to the
# `custom_config_model` parameter in the `foca.Foca()` constructor
custom:
  my_param: 'some_value'

# Any other sections/parameters are *not* validated by FOCA; if desired,
# validate parameters in app
custom_params_not_validated:
  my_other_param: 'some_other_value'
