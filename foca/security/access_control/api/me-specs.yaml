openapi: 3.0.2
info:
  title: FOCA current caller API specification
  description: 'Tells callers who they are and what they may do.'
  version: 1.0.0
  license:
    name: Apache 2.0
    url: https://github.com/elixir-cloud-aai/foca/blob/dev/LICENSE
  contact:
    name: ELIXIR On-Cloud
    email: cloud-service@elixir-europe.org
paths:
  /me:
    get:
      summary: Get the current caller.
      operationId: foca.security.access_control.me.getMe
      description: >-
        Returns who the caller is, and whether they are an admin. Any caller
        with a valid token may call it. The app may add further fields.
      tags:
        - me
      responses:
        '200':
          description: The current caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          description: The request is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: An unexpected error occurred.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
servers:
  - url: /
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      x-bearerInfoFunc: foca.security.auth.validate_token
  schemas:
    Me:
      description: The current caller, and fields of the app.
      type: object
      required:
        - subject
        - client
        - groups
        - admin
        - admin_available
      properties:
        subject:
          type: string
          nullable: true
          description: Identifier of the caller, if the token has one.
        client:
          type: string
          nullable: true
          description: Client ID, if the caller is a service client.
        groups:
          type: array
          items:
            type: string
          description: Roles from the group claims of the caller.
        admin:
          type: boolean
          description: Whether the caller is an admin on this request.
        admin_available:
          type: boolean
          description: >-
            Whether the caller is an admin, or may opt in to the role admin.
    # `Error` and `FieldError` are those of `foca/api/problem-details.yaml`
    # (`Problem` there); keep them the same (tested)
    Error:
      description: >-
        Problem details (RFC 9457). Responses to invalid requests list the
        invalid fields in `errors`.
      type: object
      required:
        - title
        - status
      properties:
        type:
          type: string
          description: >-
            URI identifying the problem type, e.g.,
            `https://foca.readthedocs.io/en/latest/problems/invalid-request/`
            for invalid requests.
        title:
          type: string
          description: Short summary of the problem type.
        status:
          type: integer
          format: int32
          description: HTTP status code.
        detail:
          type: string
          description: Explanation of this occurrence of the problem.
        instance:
          type: string
          description: URI identifying this occurrence of the problem.
        code:
          type: string
          description: >-
            Stable, kebab-case code of the problem type, e.g.,
            `invalid-request`.
        errors:
          type: array
          description: Invalid fields of the request, one entry per field.
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      description: >-
        Invalid field of a request, in the form of the example of RFC 9457,
        section 3, with either `pointer` or `parameter`.
      type: object
      required:
        - detail
        - code
      properties:
        detail:
          type: string
          description: >-
            Readable message; never quotes the rejected value (locations
            may have keys and parameter names of the request).
        pointer:
          type: string
          description: >-
            JSON Pointer (RFC 6901) to the field in the request body, as a
            URI fragment, e.g., `#/organization/url`.
          pattern: '^#(/([A-Za-z0-9_.!$&''()*+,;=:@-]|%[0-9A-Fa-f]{2}|~[01])*)*$'
        parameter:
          type: string
          description: >-
            Name of the invalid query, path, header, cookie or form data
            parameter.
        code:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: >-
            Stable, kebab-case code, e.g., `required` or `too-long`; FOCA's
            generic codes and those of the app.
      oneOf:
        - required:
            - pointer
        - required:
            - parameter
