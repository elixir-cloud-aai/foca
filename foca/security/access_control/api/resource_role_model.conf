# Reference model for resource-scoped roles.
# For detailed explanation on how to write policy models:
# visit: https://casbin.org/docs/en/syntax-for-models
#
# Supported policy rules (paths are full request paths, including base paths):
#
#   p, *, /services, POST                             # any authenticated user
#   p, owner, /services/:id, (GET)|(PUT)|(DELETE)     # owner: full access
#   p, maintainer, /services/:id, (GET)|(PUT)         # maintainer: read/update
#   p, group:vo-members, /services/:id, GET           # raw group claim value
#   g2, user:alice, owner, /services/123              # alice owns /services/123
#   g, user:bob, admin                                # bob is an admin
#
# User identifiers are prefixed with `access_control.subject_prefix` (default:
# `user:`) and group claim values without `access_control.group_mapping` with
# `group:`, so that they cannot collide with role names.
#
# Subjects with the `admin` role (assigned via `g` rules or mapped from a
# group claim via `access_control.group_mapping`) may do everything, including
# managing rules via the permissions API. Operations that do not require
# authentication (`security: []`) are not enforced, i.e., they are public.

[request_definition]
# sub - accessing entity (prefixed user identifier or role from group claims)
# obj - accessed resource (request path)
# act - access method (HTTP method)
r = sub, obj, act

[policy_definition]
# sub - prefixed user identifier, role or `*` (any authenticated user)
# obj - resource path pattern (cf. https://casbin.org/docs/function, keyMatch2)
# act - HTTP method regular expression
p = sub, obj, act

[role_definition]
# g - global roles: prefixed user identifier, role
g = _, _
# g2 - resource-scoped roles: prefixed user identifier, role, resource (path)
g2 = _, _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, "admin") || ((p.sub == "*" || g(r.sub, p.sub) || g2(r.sub, p.sub, r.obj)) && keyMatch2(r.obj, p.obj) && regexMatch(r.act, p.act))
