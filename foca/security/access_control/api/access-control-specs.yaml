openapi: 3.0.2
info:
  title: FOCA access control API specification
  description: 'CRUD and List Operations for managing permissions.'
  version: 1.0.0
  license:
    name: Apache 2.0
    url: https://github.com/elixir-cloud-aai/foca/blob/dev/LICENSE
  contact:
    name: ELIXIR On-Cloud
    email: cloud-service@elixir-europe.org
paths:
  /permissions:
    post:
      summary: Create a specific permission.
      operationId: foca.security.access_control.access_control_server.postPermission
      description: This endpoint is used to create a new permission.
      tags:
        - permission
      requestBody:
        description: Permission (meta)data to create.
        required: true
        content:
          application/json:
            schema:
              x-body-name: permission
              $ref: '#/components/schemas/Permission'
      responses:
        '200':
          description: Permission was successfully created.
          content:
            application/json:
              schema:
                description: Permission identifier.
                type: string
        '400':
          description: The request is malformed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The request is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The requester is not authorized to perform this action.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: An unexpected error occurred.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List permissions
      operationId: foca.security.access_control.access_control_server.getAllPermissions
      description: |-
        Returns permissions page by page, in the order they were created, as
        recommended by the GA4GH API pagination guide (page-based). Pages are
        not guaranteed to be consistent with each other if permissions are
        created or deleted in between.
        If `access_control.self_service` is enabled, subjects that are not
        allowed to list all permissions only get the permissions that apply
        to them.
      x-foca-self-service: true
      tags:
        - permission
      parameters:
        - name: page_size
          in: query
          description: Maximum number of permissions per page.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 1000
            default: 100
        - name: page
          in: query
          description: Page to return, starting at 0.
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
      responses:
        '200':
          description: A page of permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionList'
        '400':
          description: The request is malformed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The request is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The requester is not authorized to perform this action.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: An unexpected error occurred.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
  /permissions/{id}:
    get:
      summary: Fetch one specific permission.
      operationId: foca.security.access_control.access_control_server.getPermission
      description: |-
        This endpoint returns one specific permission.
        If `access_control.self_service` is enabled, subjects that are not
        allowed to get all permissions only get permissions that apply to
        them; others are not found.
      x-foca-self-service: true
      tags:
        - permission
      parameters:
        - name: id
          in: path
          required: true
          description: A unique identifier of the permission.
          schema:
            type: string
      responses:
        '200':
          description: A Permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission'
        '400':
          description: The request is malformed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The requester is not authorized to perform this action.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The request is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: An unexpected error occurred.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The permission cannot be found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update a specific permission.
      description: This endpoint updates a specific permission.
      operationId: foca.security.access_control.access_control_server.putPermission
      tags:
        - permission
      parameters:
        - name: id
          in: path
          required: true
          description: A unique identifier of the permission.
          schema:
            type: string
      requestBody:
        description: Permission (meta)data to update.
        required: true
        content:
          application/json:
            schema:
              x-body-name: permission
              $ref: '#/components/schemas/Permission'
      responses:
        '200':
          description: Permission was successfully updated.
          content:
            application/json:
              schema:
                description: Permission identifier.
                type: string
        '400':
          description: The request is malformed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The request is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The requester is not authorized to perform this action.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The permission is set via the app's configuration and cannot be changed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: An unexpected error occurred.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a permission.
      description: Delete an existing permission object.
      operationId: foca.security.access_control.access_control_server.deletePermission
      tags:
        - permission
      parameters:
        - name: id
          in: path
          required: true
          description: A unique identifier of the permission.
          schema:
            type: string
      responses:
        '200':
          description: The permission was successfully deleted.
          content:
            application/json:
              schema:
                description: Identifier of deleted permission.
                type: string
        '400':
          description: The request is malformed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: The request is unauthorized.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The requester is not authorized to perform this action.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The requested permission was not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The permission is set via the app's configuration and cannot be changed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: An unexpected error occurred.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
servers:
  - url: /admin/access-control
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      x-bearerInfoFunc: foca.security.auth.validate_token
  schemas:
    Permission:
      description: Permission model.
      type: object
      additionalProperties: false
      required:
        - policy_type
        - rule
      properties:
        id:
          type: string
          description: Unique identifier of the permission.
        policy_type:
          type: string
          description: Policy type of the rule, as defined in the access control
            model, e.g., `p` for policy rules and `g` for role assignments.
          pattern: '^[pg][0-9]*$'
        rule:
          $ref: '#/components/schemas/Rule'
      example:
        policy_type: 'p'
        rule:
          v0: alice
          v1: /pets
          v2: POST
    PermissionList:
      description: Page of permissions.
      type: object
      additionalProperties: false
      required:
        - results
        - pagination
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Pagination:
      description: Pagination metadata, as per the GA4GH API pagination guide.
      type: object
      additionalProperties: false
      required:
        - page
        - page_size
        - total
        - total_pages
      properties:
        page:
          type: integer
          description: Returned page, starting at 0.
        page_size:
          type: integer
          description: Maximum number of results per page.
        total:
          type: integer
          description: Total number of results.
        total_pages:
          type: integer
          description: Total number of pages.
    Rule:
      description: Rule definition, with values in the order of the fields of
        the policy type's definition in the access control model. Values must
        not be empty, must not contain commas or line breaks and must not start
        with `#`. Values of `act` fields must be regular expressions that match
        the whole action.
      type: object
      additionalProperties: false
      required:
        - v0
      properties:
        v0:
          type: string
          description: Param 0.
        v1:
          type: string
          description: Param 1.
        v2:
          type: string
          description: Param 2.
        v3:
          type: string
          description: Param 3.
        v4:
          type: string
          description: Param 4.
        v5:
          type: string
          description: Param 5.
      example:
        v0: alice
        v1: /pets
        v2: POST
    Error:
      description: Problem details (RFC 9457).
      type: object
      required:
        - title
        - status
      properties:
        title:
          type: string
          description: Short summary of the problem type.
        status:
          type: integer
          format: int32
          description: HTTP status code.
        detail:
          type: string
          description: Explanation of this occurrence of the problem.
        type:
          type: string
          description: URI identifying the problem type.
        instance:
          type: string
          description: URI identifying this occurrence of the problem.
