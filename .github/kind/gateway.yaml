# Gateway of Envoy Gateway for the kind installation in CI (see
# `.github/workflows/charts.yml` and `examples/petstore/chart/ci/
# gateway-values.yaml`): a shared Gateway `eg` in the namespace `gateway`
# with an HTTP and an HTTPS listener (with the self-signed certificate of the
# Secret `gateway-tls`) for routes from all namespaces. The Envoy proxy's
# Service is a ClusterIP Service, as kind has no load balancer; CI reaches it
# via port forwarding. A single List, so that it is one YAML document
apiVersion: v1
kind: List
items:
- apiVersion: gateway.envoyproxy.io/v1alpha1
  kind: EnvoyProxy
  metadata:
    name: cluster-ip
    namespace: envoy-gateway-system
  spec:
    provider:
      type: Kubernetes
      kubernetes:
        envoyService:
          type: ClusterIP
- apiVersion: gateway.networking.k8s.io/v1
  kind: GatewayClass
  metadata:
    name: eg
  spec:
    controllerName: gateway.envoyproxy.io/gatewayclass-controller
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: cluster-ip
      namespace: envoy-gateway-system
- apiVersion: gateway.networking.k8s.io/v1
  kind: Gateway
  metadata:
    name: eg
    namespace: gateway
  spec:
    gatewayClassName: eg
    listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
        - name: gateway-tls
      allowedRoutes:
        namespaces:
          from: All
