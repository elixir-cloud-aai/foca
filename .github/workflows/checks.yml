# Lint, type-check and test the package and build the docs and distributions;
# run the unit tests again with the lowest direct dependency versions; run
# integration tests on the petstore example; scan the Docker images for known
# vulnerabilities; on pushes to `dev`, build, push, attest and sign Docker
# images with dated tags (release images are built by `release.yml`).

name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint, type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/lint.txt
            requirements/release.txt
      - name: Install package and tools
        run: >-
          pip install -e .[dev,docs] -r requirements/lint.txt
          -r requirements/release.txt
      - name: Check ruff version of pre-commit hook
        # The pre-commit hook must lint as the lint job does
        run: |
          pinned="$(sed -n 's/^ruff==//p' requirements/lint.txt)"
          hook="$(grep -A1 'astral-sh/ruff-pre-commit' .pre-commit-config.yaml \
            | sed -n 's/^ *rev: v//p')"
          if [ -z "${pinned}" ] || [ "${pinned}" != "${hook}" ]; then
            echo "::error file=.pre-commit-config.yaml::ruff hook ${hook:-?} differs from requirements/lint.txt (${pinned:-?})"
            exit 1
          fi
      - name: Lint with ruff
        run: ruff check --output-format=github
      - name: Check formatting with ruff
        run: ruff format --check
      - name: Type-check with mypy
        # Checks the files configured in `pyproject.toml` (package and tests)
        run: mypy
      - name: Build documentation
        run: mkdocs build --strict
      # In its own environment, as cffconvert pins an old jsonschema; its
      # dependencies resolve within its own bounds. 2.0.0 is the latest stable
      # release (not bumped by Dependabot; update manually)
      - name: Validate citation metadata
        run: pipx run --spec cffconvert==2.0.0 cffconvert --validate -i CITATION.cff
      - name: Build distributions
        env:
          # Pins the build requirements in the isolated build environment
          PIP_CONSTRAINT: ${{ github.workspace }}/requirements/release.txt
        run: python -m build
      - name: Check distributions
        run: twine check --strict dist/*

  test:
    name: Unit tests (Python ${{ matrix.python-version }}, MongoDB ${{ matrix.mongodb-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # MongoDB 8.0 refuses to start on Linux kernels 6.19 to 7.0.13, which
    # some runners have (https://jira.mongodb.org/browse/SERVER-121912), so
    # on those kernels the MongoDB 8.0 job skips its remaining steps and
    # passes without testing anything, with a warning and a note in the job
    # summary; on other kernels, it runs the tests like the MongoDB 7.0 jobs.
    # The check uses the upstream version from `uname -r`; Ubuntu kernels
    # report patch level 0 (e.g. 7.0.0-38-generic) even with backported
    # fixes, so they count as affected until the runners move to a newer
    # kernel series
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        mongodb-version: ["7.0"]
        include:
          - python-version: "3.13"
            mongodb-version: "8.0"
    steps:
      # All following steps of this job, except the Codecov upload (MongoDB
      # 7.0 only), need `if: steps.kernel.outputs.skip != 'true'`
      - name: Check kernel for MongoDB 8.0
        id: kernel
        if: matrix.mongodb-version == '8.0'
        run: |
          release="$(uname -r)"
          # Numeric part only, e.g. 7.0.0 for 7.0.0-38-generic; empty if
          # there is none, and then treated as unaffected (tests run)
          version="$(printf '%s\n' "${release}" | grep -oE '^[0-9]+(\.[0-9]+)*')" || true
          # True if version $1 >= version $2
          version_ge() {
            [ "$(printf '%s\n' "$1" "$2" | sort -V | head -n 1)" = "$2" ]
          }
          if [ -n "${version}" ] \
              && version_ge "${version}" 6.19 \
              && ! version_ge "${version}" 7.0.14; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            message="MongoDB 8.0 tests skipped, no tests ran: kernel ${release} is affected by SERVER-121912 (https://jira.mongodb.org/browse/SERVER-121912)"
            echo "::warning title=MongoDB 8.0 tests skipped::${message}"
            echo "${message}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Kernel ${release} is not affected by SERVER-121912"
          fi
      - name: Checkout repository
        if: steps.kernel.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        if: steps.kernel.outputs.skip != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        if: steps.kernel.outputs.skip != 'true'
        run: pip install -e .[dev]
      - name: Start MongoDB
        if: steps.kernel.outputs.skip != 'true'
        uses: supercharge/mongodb-github-action@315db7fe45ac2880b7758f1933e6e5d59afd5e94 # 1.12.1
        with:
          mongodb-version: ${{ matrix.mongodb-version }}
          mongodb-port: 12345
      - name: Run unit tests with coverage
        if: steps.kernel.outputs.skip != 'true'
        # `coverage report` (with the missing lines) and `coverage xml` fail
        # below 100% (`fail_under` in `pyproject.toml`)
        run: |
          coverage run -m pytest
          coverage report -m
          coverage xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13' && matrix.mongodb-version == '7.0'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: test_unit
          files: ./coverage.xml
          fail_ci_if_error: true
          verbose: true

  # Test the direct runtime and dev dependencies at their lower bounds, so
  # the bounds in pyproject.toml stay honest; transitive dependencies resolve
  # to their newest versions. Uses uv, as pip has no lowest-direct
  # resolution. No coverage upload, as the `test` job covers it.
  test-lowest:
    name: Unit tests (Python 3.11, lowest direct dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"  # not bumped by Dependabot; update manually
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install package with lowest direct dependency versions
        run: uv pip install --system --resolution lowest-direct -e .[dev]
      - name: List installed versions
        run: uv pip list --system
      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@315db7fe45ac2880b7758f1933e6e5d59afd5e94 # 1.12.1
        with:
          mongodb-version: "7.0"
          mongodb-port: 12345
      - name: Run unit tests
        run: pytest

  integration:
    name: Integration tests (petstore)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PETSTORE_PY_IMAGE: 3.13-slim-trixie
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: pip install -e .[dev]
      - name: Build and start petstore app
        working-directory: examples/petstore
        run: |
          docker compose build foca-petstore-root
          docker compose up -d --build
      - name: Check FOCA image
        run: |
          image=foca-petstore-root:latest
          docker image inspect --format 'Image size: {{.Size}} bytes' "${image}"
          uid="$(docker run --rm "${image}" id -u)"
          if [ "${uid}" = "0" ]; then
            echo "Image runs as root" >&2
            exit 1
          fi
          if docker run --rm "${image}" sh -c \
              'command -v gcc || command -v git || command -v curl'; then
            echo "Image contains build tools" >&2
            exit 1
          fi
      - name: Wait for petstore app
        run: |
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8080/ && exit 0
            sleep 2
          done
          echo "Petstore app did not become ready" >&2
          exit 1
      - name: Run integration tests
        run: pytest tests/integration_tests.py
      - name: Show app logs
        if: failure()
        working-directory: examples/petstore
        run: docker compose logs

  # Scans the images with Trivy (`.github/actions/scan-image`): all findings
  # are uploaded to code scanning (not for pull requests from forks, whose
  # token cannot write them), and the job fails on critical and high
  # vulnerabilities that have a fix. Accepted findings are listed, with a
  # reason and an expiry date, in `.trivyignore.yaml`. The release workflow
  # scans the release commit's images again (`release.yml`), and the images of
  # the latest release are scanned weekly (`scan.yml`)
  scan:
    name: Scan image (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: PY_IMAGE=${{ matrix.python-version }}-slim-trixie
          load: true
          # Single image, for the local Docker daemon (no attestations)
          provenance: false
          tags: foca:scan
      - name: Scan image
        uses: ./.github/actions/scan-image
        with:
          image: foca:scan
          category: image-py${{ matrix.python-version }}
          upload: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

  # Stable check names for branch protection, independent of the matrices
  # (supported Python and MongoDB versions)
  test-passed:
    name: Unit tests
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check that all unit test jobs passed
        run: test "${{ needs.test.result }}" = "success"

  scan-passed:
    name: Scan images
    if: always()
    needs: [scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check that all image scans passed
        run: test "${{ needs.scan.result }}" = "success"

  docker:
    name: Publish image (Python ${{ matrix.python-version }})
    if: github.event_name == 'push'
    needs: [lint, test, test-lowest, integration, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Images get SBOM and provenance attestations (Buildx), a GitHub artifact
    # attestation and a Sigstore signature (see "Verifying images and charts"
    # in docs/deployment.md)
    permissions:
      contents: read
      id-token: write # Sigstore signing certificates
      attestations: write # GitHub artifact attestations
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, to derive the version from git tags
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Determine version and tag
        id: tag
        env:
          DOCKERHUB_ORG: ${{ secrets.DOCKERHUB_ORG }}
          REPO_NAME: ${{ github.event.repository.name }}
          PY_VERSION: ${{ matrix.python-version }}
          # Same date for all matrix jobs of a push, even across midnight
          COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          pip install -c requirements/release.txt setuptools-scm
          echo "version=$(python -m setuptools_scm)" >> "${GITHUB_OUTPUT}"
          # Fully qualified (`docker.io/`), as the attestation needs it
          image="docker.io/${DOCKERHUB_ORG}/${REPO_NAME}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          echo "tag=${image}:$(date -u -d "${COMMIT_TIMESTAMP}" '+%Y%m%d')-py${PY_VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            PY_IMAGE=${{ matrix.python-version }}-slim-trixie
            FOCA_VERSION=${{ steps.tag.outputs.version }}
          tags: ${{ steps.tag.outputs.tag }}
          sbom: true
          provenance: mode=max
          push: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.tag.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # No artifact metadata storage record (needs another permission)
          create-storage-record: false
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
