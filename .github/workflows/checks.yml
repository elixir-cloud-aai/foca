# Lint, type-check and test the package and build the distributions; run
# integration tests on the petstore example; on pushes to the default branch,
# build and push Docker images.

name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint, type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and tools
        run: pip install -e .[dev] build twine
      - name: Lint with ruff
        run: ruff check --output-format=github
      - name: Check formatting with ruff
        run: ruff format --check
      - name: Type-check with mypy
        run: mypy foca
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: twine check --strict dist/*

  test:
    name: Unit tests (Python ${{ matrix.python-version }}, MongoDB ${{ matrix.mongodb-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        mongodb-version: ["8.0"]
        include:
          - python-version: "3.13"
            mongodb-version: "7.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: pip install -e .[dev]
      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@315db7fe45ac2880b7758f1933e6e5d59afd5e94 # 1.12.1
        with:
          mongodb-version: ${{ matrix.mongodb-version }}
          mongodb-port: 12345
      - name: Run unit tests with coverage
        run: |
          coverage run --source foca -m pytest
          coverage xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13' && matrix.mongodb-version == '8.0'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: test_unit
          files: ./coverage.xml
          fail_ci_if_error: true
          verbose: true

  integration:
    name: Integration tests (petstore)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PETSTORE_PY_IMAGE: 3.13-slim-trixie
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: pip install -e .[dev]
      - name: Build and start petstore app
        working-directory: examples/petstore
        run: |
          docker compose build foca-petstore-root
          docker compose up -d --build
      - name: Wait for petstore app
        run: |
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8080/ && exit 0
            sleep 2
          done
          echo "Petstore app did not become ready" >&2
          exit 1
      - name: Run integration tests
        run: pytest tests/integration_tests.py
      - name: Show app logs
        if: failure()
        working-directory: examples/petstore
        run: docker compose logs

  docker:
    name: Publish image (Python ${{ matrix.python-version }})
    if: github.event_name == 'push'
    needs: [lint, test, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - python-version: "3.13"
            latest: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        env:
          DOCKERHUB_ORG: ${{ secrets.DOCKERHUB_ORG }}
          REPO_NAME: ${{ github.event.repository.name }}
          PY_VERSION: ${{ matrix.python-version }}
          LATEST: ${{ matrix.latest }}
          # Same date for all matrix jobs of a push, even across midnight
          COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          set -x
          IMAGE="${DOCKERHUB_ORG}/${REPO_NAME}"
          TAG="$(date -u -d "${COMMIT_TIMESTAMP}" '+%Y%m%d')-py${PY_VERSION}"
          docker build \
              -t "${IMAGE}:${TAG}" \
              -f docker/Dockerfile \
              --build-arg PY_IMAGE="${PY_VERSION}-slim-trixie" \
              .
          docker push "${IMAGE}:${TAG}"
          if [[ "${LATEST}" == "true" ]]; then
              docker tag "${IMAGE}:${TAG}" "${IMAGE}:latest"
              docker push "${IMAGE}:latest"
          fi
