# Lint, type-check and test the package and build the docs and distributions;
# run the unit tests again with the lowest direct dependency versions; run
# integration tests on the petstore example; on pushes to `dev`, build and
# push Docker images with dated tags (release images are built by
# `release.yml`).

name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint, type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/release.txt
      - name: Install package and tools
        run: pip install -e .[dev,docs] -r requirements/release.txt
      - name: Lint with ruff
        run: ruff check --output-format=github
      - name: Check formatting with ruff
        run: ruff format --check
      - name: Type-check with mypy
        run: mypy foca
      - name: Build documentation
        run: mkdocs build --strict
      - name: Build distributions
        env:
          # Pins the build requirements in the isolated build environment
          PIP_CONSTRAINT: ${{ github.workspace }}/requirements/release.txt
        run: python -m build
      - name: Check distributions
        run: twine check --strict dist/*

  test:
    name: Unit tests (Python ${{ matrix.python-version }}, MongoDB ${{ matrix.mongodb-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # MongoDB 8.0 refuses to start on Linux kernels 6.19 to 7.0.13, which
    # some runners have (https://jira.mongodb.org/browse/SERVER-121912), so
    # on those kernels the MongoDB 8.0 job skips its remaining steps and
    # passes, with a notice in the job summary; on other kernels, it runs
    # the tests like the MongoDB 7.0 jobs
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        mongodb-version: ["7.0"]
        include:
          - python-version: "3.13"
            mongodb-version: "8.0"
    steps:
      - name: Check kernel for MongoDB 8.0
        id: kernel
        if: matrix.mongodb-version == '8.0'
        run: |
          release="$(uname -r)"
          # Numeric part only, e.g. 7.0.0 for 7.0.0-38-generic
          version="$(printf '%s\n' "${release}" | grep -oE '^[0-9]+(\.[0-9]+)*')" || true
          # True if version $1 >= version $2
          version_ge() {
            [ "$(printf '%s\n' "$1" "$2" | sort -V | head -n 1)" = "$2" ]
          }
          if [ -n "${version}" ] \
              && version_ge "${version}" 6.19 \
              && ! version_ge "${version}" 7.0.14; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            message="MongoDB 8.0 tests skipped: kernel ${release} is affected by [SERVER-121912](https://jira.mongodb.org/browse/SERVER-121912)"
            echo "::notice title=MongoDB 8.0 tests skipped::Kernel ${release} is affected by SERVER-121912"
            echo "${message}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Kernel ${release} is not affected by SERVER-121912"
          fi
      - name: Checkout repository
        if: steps.kernel.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        if: steps.kernel.outputs.skip != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        if: steps.kernel.outputs.skip != 'true'
        run: pip install -e .[dev]
      - name: Start MongoDB
        if: steps.kernel.outputs.skip != 'true'
        uses: supercharge/mongodb-github-action@315db7fe45ac2880b7758f1933e6e5d59afd5e94 # 1.12.1
        with:
          mongodb-version: ${{ matrix.mongodb-version }}
          mongodb-port: 12345
      - name: Run unit tests with coverage
        if: steps.kernel.outputs.skip != 'true'
        run: |
          coverage run --source foca -m pytest
          coverage xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13' && matrix.mongodb-version == '7.0'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: test_unit
          files: ./coverage.xml
          fail_ci_if_error: true
          verbose: true

  # Test the direct runtime and dev dependencies at their lower bounds, so
  # the bounds in pyproject.toml stay honest; transitive dependencies resolve
  # to their newest versions. Uses uv, as pip has no lowest-direct
  # resolution. No coverage upload, as the `test` job covers it.
  test-lowest:
    name: Unit tests (Python 3.10, lowest direct dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"  # not bumped by Dependabot; update manually
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install package with lowest direct dependency versions
        run: uv pip install --system --resolution lowest-direct -e .[dev]
      - name: List installed versions
        run: uv pip list --system
      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@315db7fe45ac2880b7758f1933e6e5d59afd5e94 # 1.12.1
        with:
          mongodb-version: "7.0"
          mongodb-port: 12345
      - name: Run unit tests
        run: pytest

  integration:
    name: Integration tests (petstore)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PETSTORE_PY_IMAGE: 3.13-slim-trixie
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: pip install -e .[dev]
      - name: Build and start petstore app
        working-directory: examples/petstore
        run: |
          docker compose build foca-petstore-root
          docker compose up -d --build
      - name: Check FOCA image
        run: |
          image=foca-petstore-root:latest
          docker image inspect --format 'Image size: {{.Size}} bytes' "${image}"
          uid="$(docker run --rm "${image}" id -u)"
          if [ "${uid}" = "0" ]; then
            echo "Image runs as root" >&2
            exit 1
          fi
          if docker run --rm "${image}" sh -c \
              'command -v gcc || command -v git || command -v curl'; then
            echo "Image contains build tools" >&2
            exit 1
          fi
      - name: Wait for petstore app
        run: |
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8080/ && exit 0
            sleep 2
          done
          echo "Petstore app did not become ready" >&2
          exit 1
      - name: Run integration tests
        run: pytest tests/integration_tests.py
      - name: Show app logs
        if: failure()
        working-directory: examples/petstore
        run: docker compose logs

  docker:
    name: Publish image (Python ${{ matrix.python-version }})
    if: github.event_name == 'push'
    needs: [lint, test, test-lowest, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, to derive the version from git tags
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Determine version
        run: |
          pip install -c requirements/release.txt setuptools-scm
          echo "FOCA_VERSION=$(python -m setuptools_scm)" >> "${GITHUB_ENV}"
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        env:
          DOCKERHUB_ORG: ${{ secrets.DOCKERHUB_ORG }}
          REPO_NAME: ${{ github.event.repository.name }}
          PY_VERSION: ${{ matrix.python-version }}
          # Same date for all matrix jobs of a push, even across midnight
          COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          set -x
          IMAGE="${DOCKERHUB_ORG}/${REPO_NAME}"
          TAG="$(date -u -d "${COMMIT_TIMESTAMP}" '+%Y%m%d')-py${PY_VERSION}"
          docker build \
              -t "${IMAGE}:${TAG}" \
              -f docker/Dockerfile \
              --build-arg PY_IMAGE="${PY_VERSION}-slim-trixie" \
              --build-arg FOCA_VERSION="${FOCA_VERSION}" \
              .
          docker push "${IMAGE}:${TAG}"
