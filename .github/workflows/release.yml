# Release when a version tag (`vX.Y.Z`) is pushed: check the release and that
# CI passed for its commit, and build the distributions (`prepare`), build the Docker images and push them by
# digest (untagged; `push`), scan exactly those digests in jobs without the
# release credentials and signing identity (`scan`), release the
# distributions to PyPI (`pypi`), attest, sign and only then tag the scanned
# digests (`release-image`), and create the GitHub release (`publish`).
# `push`, `pypi` and `release-image` each need approval in the `release`
# environment (required reviewer; one approval covers all matrix jobs waiting
# for it). The version is derived
# from the tag (via setuptools-scm). Release notes are the curated
# `docs/releases/<version>.md` followed by GitHub's generated notes if the
# former exists (the run fails before anything is published if it is
# missing although other releases have notes, contains `TODO` or is not in
# the agreed format, see `scripts/release_notes.py`), otherwise the
# generated notes alone; add curated notes to the `nav` of `mkdocs.yml` too
# (the docs build fails otherwise). Uses PyPI trusted publishing (no API
# token); the PyPI project trusts this workflow file in the `release`
# environment. See "Versioning and releases" in docs/contributing/index.md.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Fully qualified (`docker.io/`), as the attestation needs it. The Docker Hub
# organization is the repository variable `DOCKERHUB_ORG` (by default
# `elixircloud`), as in `scan.yml`, so that the scan job, which has no
# secrets, scans the image that is published
env:
  IMAGE_NAME: docker.io/${{ vars.DOCKERHUB_ORG || 'elixircloud' }}/${{ github.event.repository.name }}

# One release at a time, so that their Docker images and GitHub releases do
# not interfere
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Checks the tag, the release commit, the citation metadata and the release
  # notes, and builds the distributions, before anything is published
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # read the CI runs of the release commit
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      stable: ${{ steps.version.outputs.stable }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, to derive the version from git tags and to check
          # that the release commit is on `main`
          fetch-depth: 0
      - name: Check release tag and commit
        id: version
        # Guards against accidental releases from unmerged commits. The
        # `release` environment's protection rules (required reviewer, release
        # tags only) are what actually control publishing.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
              echo "Tag '${TAG}' is not a release version (e.g., v1.2.3 or v1.2.3rc1)" >&2
              exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "Release commit is not on 'main'" >&2
              exit 1
          fi
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"
          # `stable`: not an alpha, beta or release candidate (decides
          # `latest`); `prerelease`: GitHub pre-release, also for all
          # releases before 1.0.0
          stable=true
          if [[ "${TAG}" =~ (a|b|rc)[0-9]+$ ]]; then
              stable=false
          fi
          echo "stable=${stable}" >> "${GITHUB_OUTPUT}"
          if [[ "${stable}" == "false" || "${TAG}" == v0.* ]]; then
              echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
              echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi
      # The checks here don't run the tests: require a successful run of the
      # CI workflow for a push of the release commit (to `dev`); runs for pull
      # requests test merge commits, not the commit itself. A successful
      # re-run of CI counts; the step also fails while CI is still running
      - name: Check that CI passed for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          runs="$(gh api "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&status=success&per_page=1" \
              --jq .total_count)"
          if [[ ! "${runs}" =~ ^[0-9]+$ || "${runs}" -lt 1 ]]; then
              echo "::error::No successful run of the CI workflow (ci.yml) for a push of ${GITHUB_SHA}; once CI passed for it, re-run this workflow"
              exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # Zenodo archives the release with the citation metadata of the tagged
      # commit, so they must have the release version (see "Versioning and
      # releases" in docs/contributing/index.md)
      - name: Check citation metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/citation.py check "${VERSION}"
      # Curated release notes are published as written, so unfinished ones
      # (with a `TODO`) must not be published, nor ones that are not in the
      # agreed format (`scripts/release_notes.py`); they are required for
      # every release after the first one that had them (`docs/releases/`).
      # Checked here, before anything is published
      - name: Check release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python scripts/release_notes.py require "${VERSION}"
          notes="docs/releases/${VERSION}.md"
          if [[ -f "${notes}" ]]; then
              if grep -n "TODO" "${notes}"; then
                  echo "::error::${notes} contains TODO: finish the release notes, then tag a new release"
                  exit 1
              fi
              python scripts/release_notes.py check "${notes}"
          fi
      - name: Install build tools
        run: pip install -r requirements/release.txt
      # PyPI can't resolve the relative image paths of the README (the logo):
      # they become absolute URLs pinned to the release tag, so the long
      # description of the package shows the images (`scripts/readme_images.py`)
      - name: Make README image paths absolute
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          python scripts/readme_images.py rewrite \
              "https://raw.githubusercontent.com/${REPOSITORY}/${TAG}"
          python scripts/readme_images.py check
      - name: Build distributions
        env:
          # Pins the build requirements in the isolated build environment
          PIP_CONSTRAINT: ${{ github.workspace }}/requirements/release.txt
          # The rewritten README makes the work tree dirty, which would
          # change the version derived from the tag (setuptools-scm)
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.version }}
        run: python -m build
      - name: Check that distributions have the release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ls "dist/foca-${VERSION}.tar.gz" "dist/foca-${VERSION}-py3-none-any.whl"
      - name: Check distributions
        run: twine check --strict dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Release package
    # Only once the images passed the scan, as PyPI files are immutable
    needs: [prepare, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
      url: https://pypi.org/project/foca/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # PyPI files are immutable; skip those already uploaded, so that
          # re-running a partially failed upload completes the release
          skip-existing: true

  # Builds each image once and pushes it by digest only (untagged, with SBOM
  # and provenance attestations, `mode=max`), for `scan` to scan and
  # `release-image` to sign and tag. The digest is passed on as an artifact
  # (`digest-pyV`), as all jobs of a matrix share one set of outputs. Runs
  # only after approval in the `release` environment, so that nothing is
  # pushed without it; digests of runs that fail (or fail the scan) are never
  # signed or tagged, but stay on Docker Hub, untagged (pullable by digest
  # only)
  push:
    name: Push release image (Python ${{ matrix.python-version }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Waits for approval (required reviewer)
    environment: release
    permissions:
      contents: read
    strategy:
      # Without all images, nothing is published
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            PY_IMAGE=${{ matrix.python-version }}-slim-trixie
            FOCA_VERSION=${{ needs.prepare.outputs.version }}
            FOCA_REVISION=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
      - name: Check FOCA version of image
        env:
          IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          actual="$(docker run --rm "${IMAGE}" \
              python -c "from importlib.metadata import version; print(version('foca'))")"
          if [[ "${actual}" != "${VERSION}" ]]; then
              echo "::error::Image reports version '${actual}', expected '${VERSION}'"
              exit 1
          fi
      - name: Save image digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "${DIGEST}" > "${RUNNER_TEMP}/digest.txt"
      - name: Upload image digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/digest.txt
          if-no-files-found: error
          # A re-run pushes a new digest, which replaces the earlier one
          overwrite: true

  # Scans exactly the pushed images (`<image>@<digest>`) with Trivy
  # (shared action `elixir-cloud-aai/.github/actions/scan-image`; fails on
  # fixable critical and high vulnerabilities) before anything is
  # published, in a job without credentials or signing permissions, as the
  # Trivy action resolves the Trivy binary from a mutable tag; the images
  # are public, so pulling them needs no login. See the `scan` job of
  # `ci.yml`. No upload to code scanning
  scan:
    name: Scan release image (Python ${{ matrix.python-version }})
    needs: push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download image digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-py${{ matrix.python-version }}
          path: ${{ runner.temp }}
      - name: Read image digest
        id: digest
        run: |
          digest="$(cat "${RUNNER_TEMP}/digest.txt")"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid image digest '${digest}'"
              exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - name: Scan image
        uses: elixir-cloud-aai/.github/actions/scan-image@743e82d290a53768454999e413756a924e383259 # v1.0.0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
          category: release-py${{ matrix.python-version }}
          upload: "false"

  # Attests the build provenance of each scanned digest (GitHub artifact
  # attestation, also pushed to the registry), signs it (cosign keyless
  # signing, via the workflow's OIDC token) and only then tags exactly that
  # digest, so that the published images are the scanned ones; see
  # "Verifying images and charts" in docs/deployment.md
  release-image:
    name: Release image (Python ${{ matrix.python-version }})
    needs: [prepare, scan, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Waits for approval (required reviewer)
    environment: release
    permissions:
      contents: read
      id-token: write # Sigstore signing certificates
      attestations: write # GitHub artifact attestations
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - python-version: "3.13"
            default: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # All tags, to check whether this is the latest release
          fetch-depth: 0
      - name: Download image digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-py${{ matrix.python-version }}
          path: ${{ runner.temp }}
      - name: Read image digest
        id: digest
        run: |
          digest="$(cat "${RUNNER_TEMP}/digest.txt")"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid image digest '${digest}'"
              exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          # No artifact metadata storage record (needs another permission)
          create-storage-record: false
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # The signature covers the digest, and so every tag of it
      - name: Sign image
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
      # Tags `X.Y.Z-pyV` (and, for the default Python version, `X.Y.Z` and
      # `latest`) point to the scanned and signed digest: a single source is
      # copied as is
      - name: Tag image
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          PY_VERSION: ${{ matrix.python-version }}
          DEFAULT: ${{ matrix.default }}
          VERSION: ${{ needs.prepare.outputs.version }}
          STABLE: ${{ needs.prepare.outputs.stable }}
        run: |
          tags=("${IMAGE_NAME}:${VERSION}-py${PY_VERSION}")
          if [[ "${DEFAULT}" == "true" ]]; then
              tags+=("${IMAGE_NAME}:${VERSION}")
              # `latest` only for the highest stable release on `main`
              # (stray tags are ignored), e.g., not for a patch release of an
              # older minor version; from freshly fetched tags (the repository
              # is public), so that neither a re-run of an older release nor
              # a concurrent release moves `latest` back
              git fetch --quiet --force --tags origin \
                  "+refs/heads/main:refs/remotes/origin/main"
              latest_tag="$(git tag -l 'v*' --merged origin/main --sort=-v:refname \
                  | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
              if [[ "${STABLE}" == "true" && "${latest_tag}" == "v${VERSION}" ]]; then
                  tags+=("${IMAGE_NAME}:latest")
              fi
          fi
          for tag in "${tags[@]}"; do
              docker buildx imagetools create --tag "${tag}" "${IMAGE_NAME}@${DIGEST}"
              actual="$(docker buildx imagetools inspect "${tag}" \
                  --format '{{ json .Manifest }}' | jq -r .digest)"
              if [[ "${actual}" != "${DIGEST}" ]]; then
                  echo "::error::${tag} points to ${actual}, expected ${DIGEST}"
                  exit 1
              fi
          done

  publish:
    name: Publish release
    needs: [prepare, pypi, release-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # For `scripts/release_assets.py` and `scripts/release_notes.py`
      # (standard library only), and the curated notes of the release commit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # Assets of a published immutable release can't be added, replaced or
      # deleted, so the release is created as a draft, gets the
      # distributions, and is published last. Re-runs finish a draft of an
      # earlier attempt, whose notes are replaced (not added to); a release
      # that is already published (e.g., by hand) gets no uploads, but must
      # have all distributions by name, or the step fails, saying what to do
      # (see `scripts/release_assets.py`), and keeps its notes
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          # All releases of the repository, drafts included, to find those of
          # the tag
          releases="$(mktemp)"
          gh api --paginate --slurp "repos/${GH_REPO}/releases?per_page=100" \
              > "${releases}"
          state="$(python scripts/release_assets.py state "${TAG}" \
              --releases "${releases}" dist/*)"
          state="${state#state=}"
          if [[ "${state}" == "published" ]]; then
              exit 0
          fi
          # With curated notes of the release commit, the body is the curated
          # notes, then GitHub's generated ones (the agreed format, see
          # `scripts/release_notes.py`); otherwise the generated ones alone.
          # Generated as `gh release create --generate-notes` does (since the
          # previous release), on every run, so that a draft of an earlier
          # attempt gets the notes since the current previous release
          curated="docs/releases/${VERSION}.md"
          notes_file="$(mktemp)"
          gh api "repos/${GH_REPO}/releases/generate-notes" \
              -f "tag_name=${TAG}" --jq .body > "${notes_file}"
          if [[ -f "${curated}" ]]; then
              generated="${notes_file}"
              notes_file="$(mktemp)"
              python scripts/release_notes.py body "${curated}" "${generated}" \
                  > "${notes_file}"
          fi
          if [[ "${state}" == "none" ]]; then
              gh release create "${TAG}" \
                  --draft \
                  --verify-tag \
                  --title "${TAG}" \
                  --notes-file "${notes_file}" \
                  --prerelease="${PRERELEASE}"
          fi
          # Uploads to drafts may replace the assets of an earlier attempt
          gh release upload "${TAG}" dist/* --clobber
          # Publishes the draft, with the notes of this run (replacing those
          # of an earlier attempt); GitHub never marks pre-releases as the
          # latest release
          gh release edit "${TAG}" --notes-file "${notes_file}" \
              --prerelease="${PRERELEASE}" --draft=false
