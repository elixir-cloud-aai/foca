# Release when a version tag (`vX.Y.Z`) is pushed: build the distributions,
# build the Docker images and push them by digest (untagged), scan exactly
# those digests, publish the distributions to PyPI, attest, sign and tag the
# scanned digests, and create the GitHub release. The version is derived
# from the tag (via setuptools-scm). Uses PyPI trusted publishing (no API
# token); the PyPI project trusts this workflow file in the `pypi`
# environment. See "Releasing" in README.md.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Fully qualified (`docker.io/`), as the attestation needs it. The Docker Hub
# organization is the repository variable `DOCKERHUB_ORG` (by default
# `elixircloud`), as in `scan.yml`, so that the scan job, which has no
# secrets, scans the image that is published
env:
  IMAGE_NAME: docker.io/${{ vars.DOCKERHUB_ORG || 'elixircloud' }}/${{ github.event.repository.name }}

# One release at a time, so that their Docker images and GitHub releases do
# not interfere
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      stable: ${{ steps.version.outputs.stable }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, to derive the version from git tags and to check
          # that the release commit is on `main`
          fetch-depth: 0
      - name: Check release tag and commit
        id: version
        # Guards against accidental releases from unmerged commits. The
        # `pypi` environment's protection rules (required reviewer, `v*`
        # tags only) are what actually control publishing.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
              echo "Tag '${TAG}' is not a release version (e.g., v1.2.3 or v1.2.3rc1)" >&2
              exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "Release commit is not on 'main'" >&2
              exit 1
          fi
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"
          # `stable`: not an alpha, beta or release candidate (decides
          # `latest`); `prerelease`: GitHub pre-release, also for all
          # releases before 1.0.0
          stable=true
          if [[ "${TAG}" =~ (a|b|rc)[0-9]+$ ]]; then
              stable=false
          fi
          echo "stable=${stable}" >> "${GITHUB_OUTPUT}"
          if [[ "${stable}" == "false" || "${TAG}" == v0.* ]]; then
              echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
              echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # Zenodo archives the release with the citation metadata of the tagged
      # commit, so they must have the release version (see "Releasing" in
      # README.md)
      - name: Check citation metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python scripts/citation.py check "${VERSION}"
      - name: Install build tools
        run: pip install -r requirements/release.txt
      - name: Build distributions
        env:
          # Pins the build requirements in the isolated build environment
          PIP_CONSTRAINT: ${{ github.workspace }}/requirements/release.txt
        run: python -m build
      - name: Check that distributions have the release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ls "dist/foca-${VERSION}.tar.gz" "dist/foca-${VERSION}-py3-none-any.whl"
      - name: Check distributions
        run: twine check --strict dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    # Only once the images passed the scan, as PyPI files are immutable
    needs: [build, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/foca/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # PyPI files are immutable; skip those already uploaded, so that
          # re-running a partially failed upload completes the release
          skip-existing: true

  # Builds each image once and pushes it by digest only (untagged, with SBOM
  # and provenance attestations, `mode=max`), for `scan` to scan and `docker`
  # to sign and tag. The digest is passed on as an artifact (`digest-pyV`),
  # as all jobs of a matrix share one set of outputs. Runs before the approval
  # in the `pypi` environment; digests of runs that fail (or fail the scan)
  # are never signed or tagged, but stay on Docker Hub, untagged (pullable by
  # digest only)
  push:
    name: Push image (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      # Without all images, nothing is published
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            PY_IMAGE=${{ matrix.python-version }}-slim-trixie
            FOCA_VERSION=${{ needs.build.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
      - name: Check FOCA version of image
        env:
          IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          actual="$(docker run --rm "${IMAGE}" \
              python -c "from importlib.metadata import version; print(version('foca'))")"
          if [[ "${actual}" != "${VERSION}" ]]; then
              echo "::error::Image reports version '${actual}', expected '${VERSION}'"
              exit 1
          fi
      - name: Save image digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "${DIGEST}" > "${RUNNER_TEMP}/digest.txt"
      - name: Upload image digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/digest.txt
          if-no-files-found: error
          # A re-run pushes a new digest, which replaces the earlier one
          overwrite: true

  # Scans exactly the pushed images (`<image>@<digest>`) with Trivy
  # (`.github/actions/scan-image`; fails on fixable critical and high
  # vulnerabilities) before anything is published, in a job without
  # credentials or signing permissions, as the Trivy action resolves the
  # Trivy binary from a mutable tag; the images are public, so pulling them
  # needs no login. See the `scan` job of `checks.yml`. No upload to code
  # scanning
  scan:
    name: Scan image (Python ${{ matrix.python-version }})
    needs: push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download image digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-py${{ matrix.python-version }}
          path: ${{ runner.temp }}
      - name: Read image digest
        id: digest
        run: |
          digest="$(cat "${RUNNER_TEMP}/digest.txt")"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid image digest '${digest}'"
              exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - name: Scan image
        uses: ./.github/actions/scan-image
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
          category: release-py${{ matrix.python-version }}
          upload: "false"

  # Attests the build provenance of each scanned digest (GitHub artifact
  # attestation, also pushed to the registry), signs it (cosign keyless
  # signing, via the workflow's OIDC token) and only then tags exactly that
  # digest, so that the published images are the scanned ones; see
  # "Verifying images and charts" in docs/deployment.md
  docker:
    name: Publish image (Python ${{ matrix.python-version }})
    needs: [build, scan, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Sigstore signing certificates
      attestations: write # GitHub artifact attestations
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - python-version: "3.13"
            default: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # All tags, to check whether this is the latest release
          fetch-depth: 0
      - name: Download image digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-py${{ matrix.python-version }}
          path: ${{ runner.temp }}
      - name: Read image digest
        id: digest
        run: |
          digest="$(cat "${RUNNER_TEMP}/digest.txt")"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid image digest '${digest}'"
              exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          # No artifact metadata storage record (needs another permission)
          create-storage-record: false
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # The signature covers the digest, and so every tag of it
      - name: Sign image
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
      # Tags `X.Y.Z-pyV` (and, for the default Python version, `X.Y.Z` and
      # `latest`) point to the scanned and signed digest: a single source is
      # copied as is
      - name: Tag image
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          PY_VERSION: ${{ matrix.python-version }}
          DEFAULT: ${{ matrix.default }}
          VERSION: ${{ needs.build.outputs.version }}
          STABLE: ${{ needs.build.outputs.stable }}
        run: |
          tags=("${IMAGE_NAME}:${VERSION}-py${PY_VERSION}")
          if [[ "${DEFAULT}" == "true" ]]; then
              tags+=("${IMAGE_NAME}:${VERSION}")
              # `latest` only for the highest stable release on `main`
              # (stray tags are ignored), e.g., not for a patch release of an
              # older minor version; from freshly fetched tags (the repository
              # is public), so that neither a re-run of an older release nor
              # a concurrent release moves `latest` back
              git fetch --quiet --force --tags origin \
                  "+refs/heads/main:refs/remotes/origin/main"
              latest_tag="$(git tag -l 'v*' --merged origin/main --sort=-v:refname \
                  | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
              if [[ "${STABLE}" == "true" && "${latest_tag}" == "v${VERSION}" ]]; then
                  tags+=("${IMAGE_NAME}:latest")
              fi
          fi
          for tag in "${tags[@]}"; do
              docker buildx imagetools create --tag "${tag}" "${IMAGE_NAME}@${DIGEST}"
              actual="$(docker buildx imagetools inspect "${tag}" \
                  --format '{{ json .Manifest }}' | jq -r .digest)"
              if [[ "${actual}" != "${DIGEST}" ]]; then
                  echo "::error::${tag} points to ${actual}, expected ${DIGEST}"
                  exit 1
              fi
          done

  github-release:
    name: Create GitHub release
    needs: [build, publish, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          # On reruns, complete an existing release instead of failing
          if gh release view "${TAG}" > /dev/null 2>&1; then
              gh release upload "${TAG}" dist/* --clobber
              exit 0
          fi
          # GitHub never marks pre-releases as the latest release
          args=()
          if [[ "${PRERELEASE}" == "true" ]]; then
              args+=(--prerelease)
          fi
          gh release create "${TAG}" dist/* \
              --verify-tag \
              --title "${TAG}" \
              --generate-notes \
              "${args[@]}"
