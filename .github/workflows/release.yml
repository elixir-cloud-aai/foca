# Release when a version tag (`vX.Y.Z`) is pushed: build the distributions,
# publish them to PyPI, build, push, attest and sign Docker images, and
# create the GitHub release. The version is derived from the tag (via setuptools-scm). Uses
# PyPI trusted publishing (no API token); the PyPI project trusts this
# workflow file in the `pypi` environment. See "Releasing" in README.md.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time, so that their Docker images and GitHub releases do
# not interfere
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      stable: ${{ steps.version.outputs.stable }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, to derive the version from git tags and to check
          # that the release commit is on `main`
          fetch-depth: 0
      - name: Check release tag and commit
        id: version
        # Guards against accidental releases from unmerged commits. The
        # `pypi` environment's protection rules (required reviewer, `v*`
        # tags only) are what actually control publishing.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
              echo "Tag '${TAG}' is not a release version (e.g., v1.2.3 or v1.2.3rc1)" >&2
              exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "Release commit is not on 'main'" >&2
              exit 1
          fi
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"
          # `stable`: not an alpha, beta or release candidate (decides
          # `latest`); `prerelease`: GitHub pre-release, also for all
          # releases before 1.0.0
          stable=true
          if [[ "${TAG}" =~ (a|b|rc)[0-9]+$ ]]; then
              stable=false
          fi
          echo "stable=${stable}" >> "${GITHUB_OUTPUT}"
          if [[ "${stable}" == "false" || "${TAG}" == v0.* ]]; then
              echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
              echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install build tools
        run: pip install -r requirements/release.txt
      - name: Build distributions
        env:
          # Pins the build requirements in the isolated build environment
          PIP_CONSTRAINT: ${{ github.workspace }}/requirements/release.txt
        run: python -m build
      - name: Check that distributions have the release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ls "dist/foca-${VERSION}.tar.gz" "dist/foca-${VERSION}-py3-none-any.whl"
      - name: Check distributions
        run: twine check --strict dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/foca/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # PyPI files are immutable; skip those already uploaded, so that
          # re-running a partially failed upload completes the release
          skip-existing: true

  docker:
    name: Publish image (Python ${{ matrix.python-version }})
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Images get SBOM and provenance attestations (Buildx), a GitHub artifact
    # attestation and a Sigstore signature (see "Verifying images and
    # charts" in docs/deployment.md)
    permissions:
      contents: read
      id-token: write # sign the attestation and the image (Sigstore)
      attestations: write # store the attestation on GitHub
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - python-version: "3.13"
            default: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # All tags, to check whether this is the latest release
          fetch-depth: 0
      - name: Determine tags
        id: tags
        env:
          DOCKERHUB_ORG: ${{ secrets.DOCKERHUB_ORG }}
          REPO_NAME: ${{ github.event.repository.name }}
          PY_VERSION: ${{ matrix.python-version }}
          DEFAULT: ${{ matrix.default }}
          VERSION: ${{ needs.build.outputs.version }}
          STABLE: ${{ needs.build.outputs.stable }}
        run: |
          # Fully qualified (`docker.io/`), as the attestation needs it
          image="docker.io/${DOCKERHUB_ORG}/${REPO_NAME}"
          tags=("${image}:${VERSION}-py${PY_VERSION}")
          if [[ "${DEFAULT}" == "true" ]]; then
              tags+=("${image}:${VERSION}")
              # `latest` only for the highest stable release, e.g., not for
              # a patch release of an older minor version
              latest_tag="$(git tag -l 'v*' --sort=-v:refname \
                  | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
              if [[ "${STABLE}" == "true" && "${latest_tag}" == "v${VERSION}" ]]; then
                  tags+=("${image}:latest")
              fi
          fi
          printf '%s\n' "${tags[@]}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
          {
              echo "tags<<EOF"
              printf '%s\n' "${tags[@]}"
              echo "EOF"
          } >> "${GITHUB_OUTPUT}"
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            PY_IMAGE=${{ matrix.python-version }}-slim-trixie
            FOCA_VERSION=${{ needs.build.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          sbom: true
          provenance: mode=max
          push: true
      - name: Attest image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.tags.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Would need `artifact-metadata: write`
          create-storage-record: false
      - name: Set up cosign
        # Installs the cosign version pinned by the action, which it verifies
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  github-release:
    name: Create GitHub release
    needs: [build, publish, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          # On reruns, complete an existing release instead of failing
          if gh release view "${TAG}" > /dev/null 2>&1; then
              gh release upload "${TAG}" dist/* --clobber
              exit 0
          fi
          # GitHub never marks pre-releases as the latest release
          args=()
          if [[ "${PRERELEASE}" == "true" ]]; then
              args+=(--prerelease)
          fi
          gh release create "${TAG}" dist/* \
              --verify-tag \
              --title "${TAG}" \
              --generate-notes \
              "${args[@]}"
