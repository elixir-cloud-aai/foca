# Release when a version tag (`vX.Y.Z`) is pushed: build the distributions,
# publish them to PyPI, build and push Docker images, and create the GitHub
# release. The version is derived from the tag (via setuptools-scm). Uses
# PyPI trusted publishing (no API token); the PyPI project trusts this
# workflow file in the `pypi` environment. See "Releasing" in README.md.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One release at a time, so that their Docker images and GitHub releases do
# not interfere
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, to derive the version from git tags and to check
          # that the release commit is on `main`
          fetch-depth: 0
      - name: Check release tag and commit
        id: version
        # Guards against accidental releases from unmerged commits. The
        # `pypi` environment's protection rules (required reviewer, `v*`
        # tags only) are what actually control publishing.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
              echo "Tag '${TAG}' is not a release version (e.g., v1.2.3 or v1.2.3rc1)" >&2
              exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "Release commit is not on 'main'" >&2
              exit 1
          fi
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"
          if [[ "${TAG}" =~ (a|b|rc)[0-9]+$ ]]; then
              echo "prerelease=true" >> "${GITHUB_OUTPUT}"
          else
              echo "prerelease=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install build tools
        run: pip install -r requirements/release.txt
      - name: Build distributions
        env:
          # Pins the build requirements in the isolated build environment
          PIP_CONSTRAINT: ${{ github.workspace }}/requirements/release.txt
        run: python -m build
      - name: Check that distributions have the release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ls "dist/foca-${VERSION}.tar.gz" "dist/foca-${VERSION}-py3-none-any.whl"
      - name: Check distributions
        run: twine check --strict dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/foca/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # PyPI files are immutable; skip those already uploaded, so that
          # re-running a partially failed upload completes the release
          skip-existing: true

  docker:
    name: Publish image (Python ${{ matrix.python-version }})
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - python-version: "3.13"
            default: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # All tags, to check whether this is the latest release
          fetch-depth: 0
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        env:
          DOCKERHUB_ORG: ${{ secrets.DOCKERHUB_ORG }}
          REPO_NAME: ${{ github.event.repository.name }}
          PY_VERSION: ${{ matrix.python-version }}
          DEFAULT: ${{ matrix.default }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -x
          IMAGE="${DOCKERHUB_ORG}/${REPO_NAME}"
          docker build \
              -t "${IMAGE}:${VERSION}-py${PY_VERSION}" \
              -f docker/Dockerfile \
              --build-arg PY_IMAGE="${PY_VERSION}-slim-trixie" \
              --build-arg FOCA_VERSION="${VERSION}" \
              .
          docker push "${IMAGE}:${VERSION}-py${PY_VERSION}"
          if [[ "${DEFAULT}" == "true" ]]; then
              docker tag "${IMAGE}:${VERSION}-py${PY_VERSION}" "${IMAGE}:${VERSION}"
              docker push "${IMAGE}:${VERSION}"
              # `latest` only for the highest stable release, e.g., not for
              # a patch release of an older minor version
              LATEST_TAG="$(git tag -l 'v*' --sort=-v:refname \
                  | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
              if [[ "${PRERELEASE}" == "false" && "${LATEST_TAG}" == "v${VERSION}" ]]; then
                  docker tag "${IMAGE}:${VERSION}" "${IMAGE}:latest"
                  docker push "${IMAGE}:latest"
              fi
          fi

  github-release:
    name: Create GitHub release
    needs: [build, publish, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          # On reruns, complete an existing release instead of failing
          if gh release view "${TAG}" > /dev/null 2>&1; then
              gh release upload "${TAG}" dist/* --clobber
              exit 0
          fi
          args=()
          if [[ "${PRERELEASE}" == "true" ]]; then
              args+=(--prerelease)
          fi
          gh release create "${TAG}" dist/* \
              --verify-tag \
              --title "${TAG}" \
              --generate-notes \
              "${args[@]}"
