# Scan the images of the latest release (`X.Y.Z-pyV` for every Python version)
# weekly for known vulnerabilities with Trivy, as the `scan` job of
# `ci.yml` scans the images of pull requests and pushes, so that
# vulnerabilities found after a release are reported: the findings that have
# a fix are uploaded to code scanning, a full report (findings without a fix
# included) is uploaded as the workflow artifact
# `trivy-report-release-image-pyV` (JSON and table), and the workflow fails
# on critical and high vulnerabilities that have a fix (fixed by a new
# release). Accepted findings are listed in `.trivyignore.yaml`; scheduled
# runs use the default branch (`main`, the latest release), so the file is
# taken from `dev`, where findings are accepted. The images are public, so no
# Docker Hub secrets are needed; their organization is the repository
# variable `DOCKERHUB_ORG` (by default `elixircloud`, as documented in the
# docs; forks set it to the organization they publish to). Same as in
# cloud-registry, which has one image.

name: Scan

on:
  schedule:
    # Mondays, 05:17 UTC
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scheduled scan (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        # Python versions added after the latest release: the first FOCA
        # release with their images; until it is released, their jobs scan
        # nothing and pass with a notice (remove the entry once released)
        include:
          - python-version: "3.15"
            first-release: "0.18.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # All tags, to find the latest release, and `dev`
          fetch-depth: 0
      - name: Use ignore file of dev
        # The checkout stays on the triggering commit, which code scanning
        # gets the results for
        run: git show origin/dev:.trivyignore.yaml > .trivyignore.yaml
      - name: Determine image of the latest release
        id: image
        env:
          DOCKERHUB_ORG: ${{ vars.DOCKERHUB_ORG || 'elixircloud' }}
          PY_VERSION: ${{ matrix.python-version }}
          FIRST_RELEASE: ${{ matrix.first-release }}
        run: |
          # Highest final version on `main`, as for the `latest` tag in
          # `release.yml`
          tag="$(git tag -l 'v*' --merged origin/main --sort=-v:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
          if [ -z "${tag}" ]; then
              echo "::error::No release tag found"
              exit 1
          fi
          # True if version $1 >= version $2
          version_ge() {
              [ "$(printf '%s\n' "$1" "$2" | sort -V | head -n 1)" = "$2" ]
          }
          if [ -n "${FIRST_RELEASE}" ] \
              && ! version_ge "${tag#v}" "${FIRST_RELEASE}"; then
              message="No image scanned: ${tag} has no Python ${PY_VERSION} image (first in ${FIRST_RELEASE})"
              echo "::notice title=No Python ${PY_VERSION} image yet::${message}"
              echo "${message}" >> "${GITHUB_STEP_SUMMARY}"
              echo "skip=true" >> "${GITHUB_OUTPUT}"
              exit 0
          fi
          # Scheduled runs have no event payload, so the repository name is
          # taken from `GITHUB_REPOSITORY` (`<owner>/<name>`)
          image="docker.io/${DOCKERHUB_ORG}/${GITHUB_REPOSITORY#*/}:${tag#v}-py${PY_VERSION}"
          echo "Scanning ${image}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"
      - name: Scan image
        if: steps.image.outputs.skip != 'true'
        uses: ./.github/actions/scan-image
        with:
          image: ${{ steps.image.outputs.image }}
          category: release-image-py${{ matrix.python-version }}
          report: "true"
