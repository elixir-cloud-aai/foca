# Release the library chart foca-common when a chart tag (`chart-vX.Y.Z`) is
# pushed: check that the tag is signed, on `dev` and matches the chart's
# `version`, and that CI passed for its commit, and lint, test and install the
# charts as CI does (`chart` and
# `chart-install` jobs of `ci.yml`, with the same local actions); after a
# maintainer approved the tested chart in the `release` environment
# (required reviewer, release tags only), check that the version was not
# published yet, then package the chart, push it as an OCI artifact to
# `oci://ghcr.io/elixir-cloud-aai/charts`, and attest and sign it (GitHub
# artifact attestation, Sigstore signature). Only final versions (no
# pre-releases). Independent of FOCA's releases (`release.yml`, tags
# `vX.Y.Z`). Chart releases come from `dev` on purpose, unlike FOCA's
# releases from `main`, so that app charts can use a chart change without
# waiting for a FOCA release. See "Releases" in docs/helm-chart.md.

name: Release chart

on:
  push:
    tags: ["chart-v*"]

permissions:
  contents: read

# One run per tag (e.g., a rerun waits for a running one); releases of
# different versions run independently, so that none is dropped from the
# queue
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  REPOSITORY: oci://ghcr.io/elixir-cloud-aai/charts
  CHART: charts/foca-common

jobs:
  # Checks the tag, then runs the checks of the `chart` and `chart-install`
  # jobs of `ci.yml`, in one job; all before the approval in `publish`
  test:
    name: Test chart release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # read the CI runs of the release commit
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history with tags, for the version checks and to check that
          # the release commit is on `dev`
          fetch-depth: 0
      - name: Check tag and version
        id: version
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ ! "${TAG}" =~ ^chart-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error::Tag '${TAG}' is not a chart release (e.g., chart-v1.2.3; no pre-releases)"
              exit 1
          fi
          version="${BASH_REMATCH[1]}"
          chart_version="$(yq '.version' "${CHART}/Chart.yaml")"
          if [ "${chart_version}" != "${version}" ]; then
              echo "::error::Tag '${TAG}' does not match version ${chart_version} in ${CHART}/Chart.yaml"
              exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/dev; then
              echo "::error::Release commit is not on 'dev'"
              exit 1
          fi
          # Annotated tags only, named as the pushed tag, with a signature
          # that GitHub verified, of the checked-out commit
          ref="$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}")"
          if [ "$(jq -r '.object.type' <<< "${ref}")" != "tag" ]; then
              echo "::error::Tag '${TAG}' is not an annotated (signed) tag"
              exit 1
          fi
          tag="$(gh api "repos/${GH_REPO}/git/tags/$(jq -r '.object.sha' <<< "${ref}")")"
          if [ "$(jq -r '.verification.verified' <<< "${tag}")" != "true" ]; then
              echo "::error::Tag '${TAG}' has no verified signature"
              exit 1
          fi
          if [ "$(jq -r '.tag' <<< "${tag}")" != "${TAG}" ]; then
              echo "::error::Tag '${TAG}' points to a tag object of another name"
              exit 1
          fi
          if [ "$(jq -r '.object.sha' <<< "${tag}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::Tag '${TAG}' does not point to the checked-out commit"
              exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # The curated notes of the version are the chart's changelog entry and
      # the start of its GitHub release (`release`), published as written:
      # they must exist, be finished (no `TODO`) and be in the agreed format
      # (`scripts/release_notes.py`), before anything is published
      - name: Check release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="docs/releases/chart/${VERSION}.md"
          if [[ ! -f "${notes}" ]]; then
              echo "::error::${notes} is missing: add the chart's release notes, bump the chart's version and tag a new release"
              exit 1
          fi
          if grep -n "TODO" "${notes}"; then
              echo "::error::${notes} contains TODO: finish the release notes, bump the chart's version and tag a new release"
              exit 1
          fi
          python scripts/release_notes.py check "${notes}"
      # The checks here don't run the tests: require a successful run of the
      # CI workflow for a push of the release commit (to `dev`); runs for pull
      # requests test merge commits, not the commit itself. A successful
      # re-run of CI counts; the step also fails while CI is still running
      - name: Check that CI passed for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          runs="$(gh api "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&status=success&per_page=1" \
              --jq .total_count)"
          if [[ ! "${runs}" =~ ^[0-9]+$ || "${runs}" -lt 1 ]]; then
              echo "::error::No successful run of the CI workflow (ci.yml) for a push of ${GITHUB_SHA}; once CI passed for it, re-run this workflow"
              exit 1
          fi
      - name: Test chart
        uses: ./.github/actions/test-chart
      - name: Install chart
        uses: ./.github/actions/install-chart

  # Waits for the approval in the `release` environment (required
  # reviewer, release tags only), as the PyPI job of `release.yml`: the
  # environment's protection rules are what actually control publishing;
  # the checks in `test` guard against mistakes
  publish:
    name: Publish chart
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
      url: https://github.com/elixir-cloud-aai/foca/pkgs/container/charts%2Ffoca-common
    permissions:
      contents: read
      packages: write # push the chart, its attestation and signature to GHCR
      id-token: write # Sigstore signing certificates
      attestations: write # GitHub artifact attestations
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history with tags, for the first-release check
          fetch-depth: 0
      # Same Helm version as in `.github/actions/test-chart`
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      - name: Log in to GHCR
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: |
          helm registry login "${REGISTRY}" --username "${ACTOR}" --password-stdin <<< "${TOKEN}"
      # Published versions are never overwritten: continue only if GHCR
      # reports the version as not found, or, for the first release (no
      # other chart tag), denies access to the package, which does not
      # exist yet; fail on any other error. The matching of Helm's error
      # messages is best-effort: if they change, the check fails closed.
      # Tags cannot be deleted or moved (tag ruleset): if a release failed,
      # re-run this workflow for the same tag (this check passes while the
      # version is unpublished; `publish` needs a new approval); if the
      # tagged commit is wrong, bump the chart's version and release a new
      # tag.
      - name: Check that version is not published
        env:
          VERSION: ${{ needs.test.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          if output="$(helm show chart "${REPOSITORY}/foca-common" --version "${VERSION}" 2>&1)"; then
              echo "::error::foca-common ${VERSION} is already published"
              exit 1
          fi
          echo "${output}"
          if grep -q ': not found' <<< "${output}"; then
              exit 0
          fi
          others="$(git tag -l 'chart-v*' | grep -vxF "${TAG}" || true)"
          if [ -z "${others}" ] && grep -q 'denied' <<< "${output}"; then
              echo "First release: the package does not exist yet"
              exit 0
          fi
          echo "::error::Could not check whether foca-common ${VERSION} is published"
          exit 1
      - name: Package and push chart
        id: push
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          helm package "${CHART}" -d dist
          if ! output="$(helm push "dist/foca-common-${VERSION}.tgz" "${REPOSITORY}" 2>&1)"; then
              echo "${output}"
              exit 1
          fi
          echo "${output}"
          digest="$(sed -n 's/^Digest: \(sha256:[0-9a-f]\{64\}\)$/\1/p' <<< "${output}")"
          if [ -z "${digest}" ]; then
              echo "::error::Could not find the digest of the pushed chart"
              exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      # The attestation and the signature are pushed next to the chart, with
      # Docker's credentials (Helm's are separate)
      - name: Log in to GHCR (Docker)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Attest chart provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/elixir-cloud-aai/charts/foca-common
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # No artifact metadata storage record (needs another permission)
          create-storage-record: false
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign chart
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/elixir-cloud-aai/charts/foca-common@${DIGEST}"
      - name: Log out of GHCR
        if: always()
        run: helm registry logout "${REGISTRY}" || true

  # Creates the GitHub release of the published chart, in its own job, so
  # that only it can write to the repository; in the `release` environment
  # as `publish` (needs its own approval)
  release:
    name: Publish chart release
    needs: [test, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # create and publish the release
      pull-requests: read # the files of the pull requests in the notes
    steps:
      # For `scripts/release_notes.py` (standard library only) and the
      # curated notes of the release commit
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      # The body is the curated notes (checked in `test`), then GitHub's
      # generated notes since the previous `chart-v*` tag (GitHub would
      # otherwise compare against the latest release, which may be one of
      # FOCA's), with only the pull requests that changed the chart
      # (`release_notes.py generated`, as in `release.yml`). The release is
      # a pre-release before 1.0.0 and never the latest release, which
      # stays FOCA's. Created as a draft and published last, like
      # `publish` in `release.yml` (without assets); re-runs finish a
      # draft of an earlier attempt, with the notes of this run, and leave
      # a published release as it is
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          releases="$(mktemp)"
          gh api --paginate --slurp "repos/${GH_REPO}/releases?per_page=100" \
              > "${releases}"
          state="$(jq -r --arg tag "${TAG}" '[.[][] | select(.tag_name == $tag)]
              | if length == 0 then "none"
                elif any(.[]; .draft | not) then "published"
                else "draft" end' "${releases}")"
          if [[ "${state}" == "published" ]]; then
              echo "The release of ${TAG} is already published"
              exit 0
          fi
          prerelease=false
          if [[ "${VERSION}" == 0.* ]]; then
              prerelease=true
          fi
          generated="$(mktemp)"
          python scripts/release_notes.py generated "${TAG}" \
              --repo "${GH_REPO}" > "${generated}"
          notes_file="$(mktemp)"
          python scripts/release_notes.py body \
              "docs/releases/chart/${VERSION}.md" "${generated}" > "${notes_file}"
          if [[ "${state}" == "none" ]]; then
              gh release create "${TAG}" \
                  --draft \
                  --verify-tag \
                  --title "foca-common ${VERSION}" \
                  --notes-file "${notes_file}" \
                  --prerelease="${prerelease}" \
                  --latest=false
          fi
          gh release edit "${TAG}" --notes-file "${notes_file}" \
              --title "foca-common ${VERSION}" \
              --prerelease="${prerelease}" --draft=false --latest=false
