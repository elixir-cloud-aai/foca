# Release the library chart foca-common when a chart tag (`chart-vX.Y.Z`) is
# pushed: check that the tag is signed, on `dev` and matches the chart's
# `version`, that the version was not published yet, lint and test the
# chart, package it and push it as an OCI artifact to
# `oci://ghcr.io/elixir-cloud-aai/charts`. Independent of FOCA's releases
# (`release.yml`, tags `vX.Y.Z`). See "Releases" in docs/helm-chart.md.

name: Release chart

on:
  push:
    tags: ["chart-v*"]

permissions:
  contents: read

# One release at a time
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  REPOSITORY: oci://ghcr.io/elixir-cloud-aai/charts
  CHART: charts/foca-common

jobs:
  release:
    name: Publish foca-common
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push the chart to GHCR
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, to check that the release commit is on `dev`
          fetch-depth: 0
      # Same Helm version as in `charts.yml`
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      - name: Check tag and version
        id: version
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ ! "${TAG}" =~ ^chart-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error::Tag '${TAG}' is not a chart release (e.g., chart-v1.2.3)"
              exit 1
          fi
          version="${BASH_REMATCH[1]}"
          chart_version="$(yq '.version' "${CHART}/Chart.yaml")"
          if [ "${chart_version}" != "${version}" ]; then
              echo "::error::Tag '${TAG}' does not match version ${chart_version} in ${CHART}/Chart.yaml"
              exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/dev; then
              echo "::error::Release commit is not on 'dev'"
              exit 1
          fi
          # Annotated tags only, with a signature that GitHub verified
          ref="$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}")"
          if [ "$(jq -r '.object.type' <<< "${ref}")" != "tag" ]; then
              echo "::error::Tag '${TAG}' is not an annotated (signed) tag"
              exit 1
          fi
          verified="$(gh api "repos/${GH_REPO}/git/tags/$(jq -r '.object.sha' <<< "${ref}")" \
              --jq '.verification.verified')"
          if [ "${verified}" != "true" ]; then
              echo "::error::Tag '${TAG}' has no verified signature"
              exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install package
        run: pip install -e .[dev]
      - name: Lint and test chart
        run: |
          helm lint --strict "${CHART}"
          helm dependency build examples/petstore/chart
          pytest charts/foca-common/tests
      - name: Log in to GHCR
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: |
          helm registry login "${REGISTRY}" --username "${ACTOR}" --password-stdin <<< "${TOKEN}"
      # Published versions are never overwritten
      - name: Check that version is not published
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if helm show chart "${REPOSITORY}/foca-common" --version "${VERSION}" > /dev/null 2>&1; then
              echo "::error::foca-common ${VERSION} is already published"
              exit 1
          fi
      - name: Package and push chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          helm package "${CHART}" -d dist
          helm push "dist/foca-common-${VERSION}.tgz" "${REPOSITORY}"
      - name: Log out of GHCR
        if: always()
        run: helm registry logout "${REGISTRY}" || true
