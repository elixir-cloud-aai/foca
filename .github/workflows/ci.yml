# Check the pull request title; lint, type-check and test the package and
# build the docs and distributions; run the unit tests again with the lowest
# direct dependency versions; run integration tests on the petstore example;
# lint and test the Helm charts and install the petstore example's chart on
# a kind cluster; scan the Docker images for known vulnerabilities; check
# the curated release notes of a release in preparation; on pushes to `dev`
# of this repository, push the Docker images by digest, scan exactly those
# digests, then attest, sign and tag them with dated tags (release images
# are built by `release.yml`).
# Forks, which have none of the secrets, run the same checks without these
# side effects and without uploads to code scanning (as pull requests from
# forks), unless they set the repository variable `DOCKERHUB_ORG` to publish
# to their own organization. `github.repository_owner == 'elixir-cloud-aai'`
# marks runs of the upstream repository. Runs also when a pull request is
# edited, so that the title check follows the title; all jobs run then. The
# gate job `passed` ("CI passed") is the only required check of this
# workflow.

name: CI

on:
  push:
    branches: [dev]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [dev]

permissions:
  contents: read

# Fully qualified (`docker.io/`), as the attestation needs it. The Docker Hub
# organization is the repository variable `DOCKERHUB_ORG` (by default
# `elixircloud`), as in `scan.yml`, so that the scan job, which has no
# secrets, scans the image that is published
env:
  IMAGE_NAME: docker.io/${{ vars.DOCKERHUB_ORG || 'elixircloud' }}/${{ github.event.repository.name }}
  # "true" if this run publishes images: pushes to this repository, or to a
  # fork that sets `DOCKERHUB_ORG` (and the Docker Hub secrets). Jobs' `if:`
  # can't read `env`, so they repeat the expression
  PUBLISH: ${{ github.event_name == 'push' && (github.repository_owner == 'elixir-cloud-aai' || vars.DOCKERHUB_ORG != '') }}

# Cancel superseded runs of a pull request; runs for pushes get their own
# group, so that runs for successive pushes are not dropped. Runs for edits
# that leave the title unchanged (e.g. of the description, also by bots)
# share a group of their own, so that they cancel each other but not the
# run for the pull request's commit
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'push' && github.sha ||
      github.event.action == 'edited' && !github.event.changes.title &&
        format('{0}-edited', github.ref) ||
      github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull request titles become the commit messages on `dev` (squash merges):
  # Conventional Commits, at most 50 characters (shared action of
  # elixir-cloud-aai/.github, pinned to the commit of a release). Skipped on
  # pushes and for Dependabot, whose titles can't be configured to pass,
  # unless someone else edits the title
  title:
    name: PR title
    if: >-
      github.event_name == 'pull_request' && (
        github.event.pull_request.user.login != 'dependabot[bot]' ||
        github.event.changes.title &&
        github.event.sender.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check PR title
        uses: elixir-cloud-aai/.github/actions/pr-title@743e82d290a53768454999e413756a924e383259 # v1.0.0

  # Static analysis, also of the docs (`mkdocs build --strict`, no job of its
  # own) and of the distributions
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/lint.txt
            requirements/release.txt
            requirements/semgrep.txt
      - name: Install package and tools
        run: >-
          pip install -e .[dev,docs] -r requirements/lint.txt
          -r requirements/release.txt
      - name: Install semgrep
        # In an environment of its own, as its dependencies conflict with
        # FOCA's; not on the PATH, which would shadow the job's Python
        run: |
          python -m venv "${RUNNER_TEMP}/semgrep"
          "${RUNNER_TEMP}/semgrep/bin/pip" install -r requirements/semgrep.txt
      - name: Check versions of pre-commit hooks
        # The pre-commit hooks must lint as the lint job does
        run: |
          check() {  # package, requirements file, hook repository
            pinned="$(sed -n "s/^$1==//p" "$2")"
            hook="$(grep -A1 "$3" .pre-commit-config.yaml \
              | sed -n 's/^ *rev: v//p')"
            if [ -z "${pinned}" ] || [ "${pinned}" != "${hook}" ]; then
              echo "::error file=.pre-commit-config.yaml::$1 hook ${hook:-?} differs from $2 (${pinned:-?})"
              return 1
            fi
          }
          check ruff requirements/lint.txt astral-sh/ruff-pre-commit
          check semgrep requirements/semgrep.txt semgrep/pre-commit
      - name: Lint with ruff
        run: ruff check --output-format=github
      - name: Check formatting with ruff
        run: ruff format --check
      - name: Type-check with mypy
        # Checks the files configured in `pyproject.toml` (package and tests)
        run: mypy
      - name: Check anti-patterns with ast-grep
        # Rules in `.ast-grep/` (`sgconfig.yml`)
        run: ast-grep scan --format github
      - name: Test ast-grep rules
        run: ast-grep test --skip-snapshot-tests
      - name: Check security issues with semgrep
        # Rules in `.semgrep/`; skips the files of `.semgrepignore`
        run: >-
          "${RUNNER_TEMP}/semgrep/bin/semgrep" scan --config .semgrep --error
          --metrics=off --disable-version-check
      - name: Test semgrep rules
        # semgrep finds no tests in hidden directories passed as targets
        working-directory: .semgrep
        run: >-
          "${RUNNER_TEMP}/semgrep/bin/semgrep" --test --metrics=off
          --disable-version-check .
      - name: Build documentation
        run: mkdocs build --strict
      # In its own environment, as cffconvert pins an old jsonschema; its
      # dependencies resolve within its own bounds. 2.0.0 is the latest stable
      # release (not bumped by Dependabot; update manually)
      - name: Validate citation metadata
        run: pipx run --spec cffconvert==2.0.0 cffconvert --validate -i CITATION.cff
      - name: Build distributions
        env:
          # Pins the build requirements in the isolated build environment
          PIP_CONSTRAINT: ${{ github.workspace }}/requirements/release.txt
        run: python -m build
      - name: Check distributions
        run: twine check --strict dist/*

  test:
    name: Test (Python ${{ matrix.python-version }}, MongoDB ${{ matrix.mongodb-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # MongoDB 8.0 refuses to start on Linux kernels 6.19 to 7.0.13, which
    # some runners have (https://jira.mongodb.org/browse/SERVER-121912), so
    # on those kernels the MongoDB 8.0 job skips its remaining steps and
    # passes without testing anything, with a warning and a note in the job
    # summary; on other kernels, it runs the tests like the MongoDB 7.0 jobs.
    # The check uses the upstream version from `uname -r`; Ubuntu kernels
    # report patch level 0 (e.g. 7.0.0-38-generic) even with backported
    # fixes, so they count as affected until the runners move to a newer
    # kernel series
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        mongodb-version: ["7.0"]
        # MongoDB 8.0 with the Python version of the default image and the
        # newest supported one
        include:
          - python-version: "3.13"
            mongodb-version: "8.0"
          - python-version: "3.15"
            mongodb-version: "8.0"
    steps:
      # All following steps of this job, except the Codecov upload (MongoDB
      # 7.0 only), need `if: steps.kernel.outputs.skip != 'true'`
      - name: Check kernel for MongoDB 8.0
        id: kernel
        if: matrix.mongodb-version == '8.0'
        run: |
          release="$(uname -r)"
          # Numeric part only, e.g. 7.0.0 for 7.0.0-38-generic; empty if
          # there is none, and then treated as unaffected (tests run)
          version="$(printf '%s\n' "${release}" | grep -oE '^[0-9]+(\.[0-9]+)*')" || true
          # True if version $1 >= version $2
          version_ge() {
            [ "$(printf '%s\n' "$1" "$2" | sort -V | head -n 1)" = "$2" ]
          }
          if [ -n "${version}" ] \
              && version_ge "${version}" 6.19 \
              && ! version_ge "${version}" 7.0.14; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            message="MongoDB 8.0 tests skipped, no tests ran: kernel ${release} is affected by SERVER-121912 (https://jira.mongodb.org/browse/SERVER-121912)"
            echo "::warning title=MongoDB 8.0 tests skipped::${message}"
            echo "${message}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Kernel ${release} is not affected by SERVER-121912"
          fi
      - name: Checkout repository
        if: steps.kernel.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        if: steps.kernel.outputs.skip != 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        if: steps.kernel.outputs.skip != 'true'
        run: pip install -e .[dev]
      - name: Start MongoDB
        if: steps.kernel.outputs.skip != 'true'
        uses: supercharge/mongodb-github-action@315db7fe45ac2880b7758f1933e6e5d59afd5e94 # 1.12.1
        with:
          mongodb-version: ${{ matrix.mongodb-version }}
          mongodb-port: 12345
      - name: Run unit tests with coverage
        if: steps.kernel.outputs.skip != 'true'
        # `coverage report` (with the missing lines) and `coverage xml` fail
        # below 100% (`fail_under` in `pyproject.toml`)
        run: |
          coverage run -m pytest
          coverage report -m
          coverage xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13' && matrix.mongodb-version == '7.0'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: test_unit
          files: ./coverage.xml
          # Outside the upstream repository (forks, which have no Codecov
          # token), upload errors don't fail CI; pull requests from forks to
          # upstream upload without a token and still fail on errors
          fail_ci_if_error: ${{ github.repository_owner == 'elixir-cloud-aai' }}
          verbose: true

  # Test the direct runtime and dev dependencies at their lower bounds, so
  # the bounds in pyproject.toml stay honest; transitive dependencies resolve
  # to their newest versions. Uses uv, as pip has no lowest-direct
  # resolution. No coverage upload, as the `test` job covers it. On the
  # oldest and the newest supported Python version, as some lower bounds
  # depend on it (environment markers in pyproject.toml). A job of its own,
  # not an entry of the `test` matrix, as it installs and runs differently
  test-lowest:
    name: Test (Python ${{ matrix.python-version }}, lowest dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.15"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"  # not bumped by Dependabot; update manually
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install package with lowest direct dependency versions
        run: uv pip install --system --resolution lowest-direct -e .[dev]
      - name: List installed versions
        run: uv pip list --system
      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@315db7fe45ac2880b7758f1933e6e5d59afd5e94 # 1.12.1
        with:
          mongodb-version: "7.0"
          mongodb-port: 12345
      - name: Run unit tests
        run: pytest

  # The petstore app is built from the FOCA image of each Python version in
  # the matrix (that of the default image and the newest supported one); the
  # tests themselves run on the runner, always with Python 3.13
  integration:
    name: Integration test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.15"]
    env:
      PETSTORE_PY_IMAGE: ${{ matrix.python-version }}-slim-trixie
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: pip install -e .[dev]
      - name: Build and start petstore app
        working-directory: examples/petstore
        run: |
          docker compose build foca-petstore-root
          docker compose up -d --build
      - name: Check FOCA image
        run: |
          image=foca-petstore-root:latest
          docker image inspect --format 'Image size: {{.Size}} bytes' "${image}"
          uid="$(docker run --rm "${image}" id -u)"
          if [ "${uid}" = "0" ]; then
            echo "Image runs as root" >&2
            exit 1
          fi
          if docker run --rm "${image}" sh -c \
              'command -v gcc || command -v git || command -v curl'; then
            echo "Image contains build tools" >&2
            exit 1
          fi
      - name: Wait for petstore app
        run: |
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8080/ && exit 0
            sleep 2
          done
          echo "Petstore app did not become ready" >&2
          exit 1
      - name: Run integration tests
        run: pytest tests/integration_tests.py
      - name: Show app logs
        if: failure()
        working-directory: examples/petstore
        run: docker compose logs

  # Lints and tests the Helm charts and checks the library chart's version
  # (`.github/actions/test-chart`, also run by `release-chart.yml`)
  chart:
    name: Chart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history with tags, for the version check
          fetch-depth: 0
      - name: Test chart
        uses: ./.github/actions/test-chart

  # Installs the petstore example's chart on a kind cluster and checks it
  # (`.github/actions/install-chart`, also run by `release-chart.yml`)
  chart-install:
    name: Chart install
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install chart
        uses: ./.github/actions/install-chart

  # The release workflow's checks of the curated release notes, before the
  # immutable tag exists: for the version in `CITATION.cff` (set before a
  # release, see "Versioning and releases" in `docs/contributing/index.md`) while
  # it has no tag, or its tag is on this commit. Not needed for publishing;
  # on pull requests and in forks (which often lack the upstream
  # repository's later tags, so that released versions look unreleased),
  # findings are warnings (so that they don't fail the gate). On pushes to
  # the upstream repository, findings fail the run
  readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The script uses the standard library only
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Check release notes
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          UPSTREAM: ${{ github.repository_owner == 'elixir-cloud-aai' }}
        run: |
          version="$(sed -En "s/^version:[[:space:]]*[\"']?([0-9A-Za-z.+-]+)[\"']?[[:space:]]*(#.*)?$/\1/p" CITATION.cff)"
          if [[ -z "${version}" ]]; then
              echo "No version in CITATION.cff: no release in preparation"
              exit 0
          fi
          # The commit of the tag, if any (of an annotated tag its peeled
          # ref, of a lightweight one the ref itself): later commits are
          # skipped, but not the tagged commit itself (e.g., if it was
          # tagged before this job ran)
          refs="$(git ls-remote origin "refs/tags/v${version}" "refs/tags/v${version}^{}")"
          tagged="$(awk '$2 ~ /\^\{\}$/ { print $1 }' <<< "${refs}")"
          if [[ -z "${tagged}" ]]; then
              tagged="$(cut -f1 <<< "${refs}")"
          fi
          if [[ -n "${tagged}" && "${tagged}" != "${SHA}" ]]; then
              echo "v${version} is tagged: no release in preparation"
              exit 0
          fi
          level=error
          if [[ "${EVENT}" == "pull_request" || "${UPSTREAM}" != "true" ]]; then
              level=warning
          fi
          status=0
          notes="docs/releases/${version}.md"
          # Curated notes are required for every release after the first
          # one that had them
          python scripts/release_notes.py require "${version}" 2> require.txt || status=1
          sed -E "s/^::error( |::)/::${level}\1/" require.txt
          if [[ -f "${notes}" ]]; then
              if grep -n "TODO" "${notes}"; then
                  echo "::${level}::${notes} contains TODO: finish the release notes before tagging v${version}"
                  status=1
              fi
              python scripts/release_notes.py check "${notes}" 2> notes.txt || status=1
              sed -E "s/^::error( |::)/::${level}\1/" notes.txt
          fi
          if [[ "${level}" == "error" ]]; then
              exit "${status}"
          fi

  # On pushes, builds each image once and pushes it by digest only (untagged,
  # with SBOM and provenance attestations, `mode=max`), for `scan` to scan and
  # `publish` to sign and tag, as in `release.yml`. The digest is passed on as
  # an artifact (`digest-pyV`), as all jobs of a matrix share one set of
  # outputs. Runs alongside the tests, so that the scan starts early; digests
  # of runs that fail (or fail the scan) are never signed or tagged, but stay
  # on Docker Hub, untagged (pullable by digest only). Not in forks without
  # `DOCKERHUB_ORG`
  push:
    name: Push image (Python ${{ matrix.python-version }})
    if: github.event_name == 'push' && (github.repository_owner == 'elixir-cloud-aai' || vars.DOCKERHUB_ORG != '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The environment only allows branch `dev`
    environment: dev-images
    permissions:
      contents: read
    strategy:
      # Without all images, nothing is published
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, to derive the version from git tags
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Determine version
        id: version
        run: |
          pip install -c requirements/release.txt setuptools-scm
          echo "version=$(python -m setuptools_scm)" >> "${GITHUB_OUTPUT}"
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            PY_IMAGE=${{ matrix.python-version }}-slim-trixie
            FOCA_VERSION=${{ steps.version.outputs.version }}
            FOCA_REVISION=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
      - name: Save image digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "${DIGEST}" > "${RUNNER_TEMP}/digest.txt"
      - name: Upload image digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/digest.txt
          if-no-files-found: error
          # A re-run pushes a new digest, which replaces the earlier one
          overwrite: true

  # Scans the images with Trivy (shared action
  # `elixir-cloud-aai/.github/actions/scan-image`): for pull requests and
  # pushes to forks (without `DOCKERHUB_ORG`) a local build, for other
  # pushes exactly the digests pushed by `push` (`<image>@<digest>`; public,
  # so pulling them needs no login), in a job without credentials or signing
  # permissions, as the Trivy action resolves the Trivy binary from a mutable
  # tag. The findings that have a fix are uploaded to code scanning of the
  # upstream repository (not in forks, nor for pull requests from forks,
  # whose token cannot write them), and the job fails on critical and high
  # vulnerabilities that have a fix. Accepted findings are listed, with a
  # reason and an expiry date, in `.trivyignore.yaml`. The release workflow scans the release images the
  # same way (`release.yml`), and the images of the latest release are
  # scanned weekly (`scan.yml`)
  scan:
    name: Scan image (Python ${{ matrix.python-version }})
    # `push` is skipped (by its own `if:` only, as it needs no other job)
    # where `PUBLISH` is "false"; a failed or cancelled push skips the scan
    needs: push
    if: ${{ !cancelled() && contains(fromJSON('["success", "skipped"]'), needs.push.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        if: env.PUBLISH != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        if: env.PUBLISH != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: PY_IMAGE=${{ matrix.python-version }}-slim-trixie
          load: true
          # Single image, for the local Docker daemon (no attestations)
          provenance: false
          # Named as the pushed images, so that code scanning matches the
          # findings of both
          tags: ${{ env.IMAGE_NAME }}:scan
      - name: Download image digest
        if: env.PUBLISH == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-py${{ matrix.python-version }}
          path: ${{ runner.temp }}
      - name: Determine image
        id: image
        run: |
          if [[ "${PUBLISH}" != "true" ]]; then
            echo "image=${IMAGE_NAME}:scan" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          digest="$(cat "${RUNNER_TEMP}/digest.txt")"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid image digest '${digest}'"
            exit 1
          fi
          echo "image=${IMAGE_NAME}@${digest}" >> "${GITHUB_OUTPUT}"
      - name: Scan image
        uses: elixir-cloud-aai/.github/actions/scan-image@743e82d290a53768454999e413756a924e383259 # v1.0.0
        with:
          image: ${{ steps.image.outputs.image }}
          category: image-py${{ matrix.python-version }}
          upload: ${{ github.repository_owner == 'elixir-cloud-aai' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}

  publish:
    name: Publish image (Python ${{ matrix.python-version }})
    if: github.event_name == 'push' && (github.repository_owner == 'elixir-cloud-aai' || vars.DOCKERHUB_ORG != '')
    needs: [lint, test, test-lowest, integration, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The environment only allows branch `dev`
    environment: dev-images
    # Attests the build provenance of each scanned digest (GitHub artifact
    # attestation, also pushed to the registry), signs it (Sigstore keyless
    # signing) and only then tags exactly that digest, so that the published
    # images are the scanned ones (see "Verifying images and charts" in
    # docs/deployment.md)
    permissions:
      contents: read
      id-token: write # Sigstore signing certificates
      attestations: write # GitHub artifact attestations
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Download image digest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-py${{ matrix.python-version }}
          path: ${{ runner.temp }}
      - name: Read image digest
        id: digest
        run: |
          digest="$(cat "${RUNNER_TEMP}/digest.txt")"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid image digest '${digest}'"
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          # No artifact metadata storage record (needs another permission)
          create-storage-record: false
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # The signature covers the digest, and so every tag of it
      - name: Sign image
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
      # Tags `YYYYMMDD-pyV` point to the scanned and signed digest: a single
      # source is copied as is
      - name: Tag image
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          PY_VERSION: ${{ matrix.python-version }}
          # Same date for all matrix jobs of a push, even across midnight
          COMMIT_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          tag="${IMAGE_NAME}:$(date -u -d "${COMMIT_TIMESTAMP}" '+%Y%m%d')-py${PY_VERSION}"
          docker buildx imagetools create --tag "${tag}" "${IMAGE_NAME}@${DIGEST}"
          actual="$(docker buildx imagetools inspect "${tag}" \
            --format '{{ json .Manifest }}' | jq -r .digest)"
          if [[ "${actual}" != "${DIGEST}" ]]; then
            echo "::error::${tag} points to ${actual}, expected ${DIGEST}"
            exit 1
          fi

  # The gate: the only required check of this workflow (ruleset), a stable
  # name independent of the jobs and their matrices. Runs always and needs
  # every other job; passes only if all of them passed. A failed or cancelled
  # job (or matrix entry) fails it, and so does a skipped job, except those
  # skipped on purpose: `title` on pushes and for Dependabot, `push` and
  # `publish` on pull requests and in forks without `DOCKERHUB_ORG` (they
  # run only if `PUBLISH` is "true"). Add new jobs to `needs`
  passed:
    name: CI passed
    if: always()
    needs:
      - title
      - lint
      - test
      - test-lowest
      - integration
      - chart
      - chart-install
      - readiness
      - push
      - scan
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check results of all jobs
        uses: elixir-cloud-aai/.github/actions/gate@743e82d290a53768454999e413756a924e383259 # v1.0.0
        with:
          needs: ${{ toJSON(needs) }}
          # `push` and `publish` are skipped on purpose only if `PUBLISH` is
          # exactly "false", so that the gate fails closed
          allow-skipped: ${{ env.PUBLISH == 'false' && 'title push publish' || 'title' }}
