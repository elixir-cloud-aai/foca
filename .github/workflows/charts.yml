# Lint and test the Helm charts: the library chart foca-common
# (`charts/foca-common`) and the thin chart of the petstore example built on
# it (`examples/petstore/chart`), with template and snapshot tests
# (`charts/foca-common/tests`); install the petstore example on a kind
# cluster with chart-testing and run its test (`helm test`). Releases of the
# library chart are published by `release-chart.yml`.

name: Charts

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint and test charts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: pip install -e .[dev]
      # Snapshots are rendered with this version; update them when it changes
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      - name: Lint charts
        run: |
          helm lint --strict charts/foca-common
          # Fails if Chart.lock is out of sync with Chart.yaml
          helm dependency build examples/petstore/chart
          helm lint --strict examples/petstore/chart \
              -f examples/petstore/chart/ci/test-values.yaml
      # Fails instead of skipping the tests if Helm is missing
      - name: Test charts
        run: |
          helm version
          pytest charts/foca-common/tests

  install:
    name: Install petstore chart on kind
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NAMESPACE: petstore
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same Helm version as in the `test` job
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
        with:
          version: 3.15.0
          uv_version: 0.13.4  # not bumped by Dependabot; update manually
      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
      # The FOCA image from the repository, and the petstore image on it,
      # which serves the app with Gunicorn
      - name: Build and load images
        run: |
          docker build -t foca-petstore-root:latest -f docker/Dockerfile .
          docker build -t foca-petstore:latest examples/petstore
          kind load docker-image foca-petstore:latest --name chart-testing
      # The Secret with the MongoDB credentials (`ci/test-values.yaml`),
      # with random passwords
      - name: Create namespace and MongoDB credentials
        run: |
          kubectl create namespace "${NAMESPACE}"
          kubectl create secret generic mongodb -n "${NAMESPACE}" \
              --from-literal=root-username=root \
              --from-literal=root-password="$(openssl rand -hex 16)" \
              --from-literal=username=petstore \
              --from-literal=password="$(openssl rand -hex 16)"
      # Installs the chart with each `ci/*-values.yaml`, waits until it is
      # ready and runs `helm test` (`templates/tests/`)
      - name: Install chart and run its test
        run: |
          ct install --charts examples/petstore/chart \
              --namespace "${NAMESPACE}" --helm-extra-args "--timeout 600s"
      - name: Show cluster state
        if: failure()
        run: |
          kubectl get all,networkpolicies,pvc -n "${NAMESPACE}"
          kubectl describe pods -n "${NAMESPACE}"
          kubectl logs -n "${NAMESPACE}" --all-containers --prefix \
              -l app.kubernetes.io/instance --tail=100
