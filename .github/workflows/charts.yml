# Lint and test the Helm charts: the library chart foca-common
# (`charts/foca-common`) and the thin chart of the petstore example built on
# it (`examples/petstore/chart`), with template and snapshot tests
# (`charts/foca-common/tests`); install the petstore example on a kind
# cluster with chart-testing, also with the Celery worker and broker, with
# access control and with an HTTPRoute of the Gateway API (via Envoy
# Gateway), and run its test (`helm test`); and check that changes of
# the library chart since its latest release raise its version. Releases of
# the library chart are published by `release-chart.yml`, which calls this
# workflow first.

name: Charts

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_call:

permissions:
  contents: read

# Prefixed, as a called workflow gets the caller's name (`github.workflow`):
# the group must differ from that of `release-chart.yml`, or GitHub cancels
# the release when this workflow is called
concurrency:
  group: charts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint and test charts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history with tags, for the version check
          fetch-depth: 0
      # Every change of the packaged library chart (not its tests) since its
      # latest release (tag `chart-vX.Y.Z`) needs a higher `version`; until
      # the first release, any version passes. On the release of a tag (via
      # `release-chart.yml`), the chart is unchanged since that tag
      - name: Check library chart version
        env:
          CHART: charts/foca-common
        run: |
          latest="$(git tag -l 'chart-v*' --sort=-v:refname \
              | grep -E '^chart-v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [ -z "${latest}" ]; then
              echo "No release of the library chart yet"
              exit 0
          fi
          if git diff --quiet "${latest}" HEAD -- "${CHART}" ":(exclude)${CHART}/tests"; then
              echo "The library chart is unchanged since ${latest}"
              exit 0
          fi
          released="${latest#chart-v}"
          version="$(yq '.version' "${CHART}/Chart.yaml")"
          # Only final versions are released (see `release-chart.yml`); this
          # also keeps `sort -V` from ordering pre-releases or build metadata
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version ${version} in ${CHART}/Chart.yaml is not a final version (X.Y.Z)"
              exit 1
          fi
          highest="$(printf '%s\n' "${released}" "${version}" | sort -V | tail -n 1)"
          if [ "${version}" = "${released}" ] || [ "${highest}" != "${version}" ]; then
              echo "::error::${CHART} changed since ${latest}: raise its version (${version}) above ${released} in ${CHART}/Chart.yaml"
              exit 1
          fi
          echo "Version ${version} is above the latest release ${released}"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: pip install -e .[dev]
      # Snapshots are rendered with this version; update them when it changes
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      - name: Lint charts
        run: |
          helm lint --strict charts/foca-common
          # Fails if Chart.lock is out of sync with Chart.yaml
          helm dependency build examples/petstore/chart
          for values in examples/petstore/chart/ci/*-values.yaml; do
            helm lint --strict examples/petstore/chart -f "${values}"
          done
      # Fails instead of skipping the tests if Helm is missing
      - name: Test charts
        run: |
          helm version
          pytest charts/foca-common/tests

  install:
    name: Install petstore chart on kind
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NAMESPACE: petstore
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same Helm version as in the `test` job
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0
        with:
          version: 3.15.0
          uv_version: 0.13.4  # not bumped by Dependabot; update manually
      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          cluster_name: chart-testing
      # Envoy Gateway, which installs the Gateway API CRDs, and the Gateway
      # `eg` of `.github/kind/gateway.yaml` with a self-signed certificate,
      # for the HTTPRoute of `ci/gateway-values.yaml`. Not bumped by
      # Dependabot; update the version manually
      - name: Install Envoy Gateway
        env:
          ENVOY_GATEWAY_VERSION: v1.9.2
          HOST: petstore-gateway.example.org
        run: |
          helm install eg oci://docker.io/envoyproxy/gateway-helm \
              --version "${ENVOY_GATEWAY_VERSION}" \
              --namespace envoy-gateway-system --create-namespace \
              --wait --timeout 300s
          kubectl create namespace gateway
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
              -subj "/CN=${HOST}" -addext "subjectAltName=DNS:${HOST}" \
              -keyout "${RUNNER_TEMP}/tls.key" -out "${RUNNER_TEMP}/tls.crt"
          kubectl create secret tls gateway-tls -n gateway \
              --cert "${RUNNER_TEMP}/tls.crt" --key "${RUNNER_TEMP}/tls.key"
          kubectl apply -f .github/kind/gateway.yaml
          kubectl wait gateway/eg -n gateway --for=condition=Programmed \
              --timeout=300s
      # The FOCA image from the repository (tagged as in the `FROM` line of
      # `examples/petstore/Dockerfile`), and the petstore image on it, which
      # serves the app with Gunicorn
      - name: Build and load images
        run: |
          docker build -t foca-petstore-root:latest -f docker/Dockerfile .
          docker build -t foca-petstore:latest examples/petstore
          kind load docker-image foca-petstore:latest --name chart-testing
      # The Secrets with the MongoDB credentials and the broker settings
      # (`ci/*-values.yaml`), with random passwords; the broker URL has the
      # host of the broker's Service of `ci/celery-values.yaml`
      - name: Create namespace and Secrets
        run: |
          kubectl create namespace "${NAMESPACE}"
          kubectl create secret generic mongodb -n "${NAMESPACE}" \
              --from-literal=root-username=root \
              --from-literal=root-password="$(openssl rand -hex 16)" \
              --from-literal=username=petstore \
              --from-literal=password="$(openssl rand -hex 16)"
          password="$(openssl rand -hex 16)"
          kubectl create secret generic celery -n "${NAMESPACE}" \
              --from-literal=username=petstore \
              --from-literal=password="${password}" \
              --from-literal=broker-url="pyamqp://petstore:${password}@petstore-celery-broker:5672//"
      # Installs the chart with each `ci/*-values.yaml`, waits until it is
      # ready and runs `helm test` (`templates/tests/`); keeps the releases
      # for the next step (the cluster is discarded with the runner)
      - name: Install chart and run its test
        run: |
          ct install --charts examples/petstore/chart --skip-clean-up \
              --namespace "${NAMESPACE}" --helm-extra-args "--timeout 600s"
      # The release of `ci/gateway-values.yaml` via the Gateway (port
      # forwarding to the Envoy proxy's Service): HTTP is redirected to HTTPS,
      # and HTTPS reaches the app through its NetworkPolicy, which blocks
      # pods outside its peers (checked from the namespace `default`)
      - name: Check app via the Gateway
        env:
          HOST: petstore-gateway.example.org
          SERVICE: petstore-gateway
        run: |
          proxy="$(kubectl get service -n envoy-gateway-system -o name \
              -l gateway.envoyproxy.io/owning-gateway-namespace=gateway,gateway.envoyproxy.io/owning-gateway-name=eg)"
          kubectl port-forward -n envoy-gateway-system "${proxy}" \
              8080:80 8443:443 > "${RUNNER_TEMP}/port-forward.log" 2>&1 &
          forward=$!
          trap 'kill "${forward}" || true' EXIT
          for _ in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:8080/; then
              break
            fi
            sleep 1
          done
          # The URLs' host and default ports, via the forwarded ports
          redirect="$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' \
              --connect-to "${HOST}:80:127.0.0.1:8080" "http://${HOST}/pets")"
          echo "HTTP: ${redirect}"
          if [ "${redirect}" != "301 https://${HOST}/pets" ]; then
            echo "::error::HTTP is not redirected to HTTPS"
            exit 1
          fi
          curl -sSf --cacert "${RUNNER_TEMP}/tls.crt" \
              --connect-to "${HOST}:443:127.0.0.1:8443" \
              "https://${HOST}/openapi.json" -o /dev/null
          echo "HTTPS: the app is reachable"
          result="$(kubectl run network-policy-check -n default \
              --image foca-petstore:latest --image-pull-policy Never \
              --restart Never --rm -i --quiet --command -- python -c "
          import socket
          address = socket.getaddrinfo('${SERVICE}.${NAMESPACE}', 8080)[0][4]
          try:
              socket.create_connection(address, timeout=10)
              print('admitted')
          except OSError:
              print('blocked')
          ")" || true
          echo "Pod outside the peers: ${result}"
          if ! grep -qx blocked <<< "${result}"; then
            echo "::error::The app's NetworkPolicy does not block pods outside its peers"
            exit 1
          fi
      # Errors that don't fail the install, e.g., of Gunicorn at startup on
      # the read-only root file system, in Gunicorn's (`[ERROR]`) and FOCA's
      # (`: ERROR   ]`) log formats
      - name: Check app logs for errors
        run: |
          logs="$(kubectl logs -n "${NAMESPACE}" --all-containers --prefix \
              -l app.kubernetes.io/component=app --tail=-1)"
          printf '%s\n' "${logs}"
          if grep -E '\[ERROR\]|: ERROR +\]' <<< "${logs}"; then
            echo "::error::The app logged errors"
            exit 1
          fi
      # The worker logs that it is ready once it has created the app and
      # connected to the broker; it has no probes, so the step polls its
      # logs. Errors as above, and in Celery's log format
      # (`ERROR/MainProcess]`), except the connection retries while the
      # broker starts (`consumer: Cannot connect to`)
      - name: Check worker logs
        run: |
          for _ in $(seq 1 30); do
            logs="$(kubectl logs -n "${NAMESPACE}" --all-containers --prefix \
                -l app.kubernetes.io/component=worker --tail=-1 2>&1)" || true
            if grep -q ' ready\.$' <<< "${logs}"; then
              break
            fi
            sleep 5
          done
          printf '%s\n' "${logs}"
          if grep -v 'consumer: Cannot connect to' <<< "${logs}" \
              | grep -E '\[ERROR\]|: ERROR +\]|ERROR/'; then
            echo "::error::The worker logged errors"
            exit 1
          fi
          if ! grep -q ' ready\.$' <<< "${logs}"; then
            echo "::error::The worker is not ready"
            exit 1
          fi
      - name: Show cluster state
        if: failure()
        run: |
          kubectl get all,networkpolicies,pvc -n "${NAMESPACE}"
          kubectl get gateways,httproutes -A -o yaml
          kubectl logs -n envoy-gateway-system deployment/envoy-gateway --tail=100
          kubectl describe pods -n "${NAMESPACE}"
          kubectl logs -n "${NAMESPACE}" --all-containers --prefix \
              -l app.kubernetes.io/instance --tail=100
