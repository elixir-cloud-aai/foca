# Lint and test the Helm charts: the library chart foca-common
# (`charts/foca-common`) and the thin chart of the petstore example built on
# it (`examples/petstore/chart`), with template and snapshot tests
# (`charts/foca-common/tests`).

name: Charts

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint and test charts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: pip install -e .[dev]
      # Snapshots are rendered with this version; update them when it changes
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      - name: Lint charts
        run: |
          helm lint --strict charts/foca-common
          # Fails if Chart.lock is out of sync with Chart.yaml
          helm dependency build examples/petstore/chart
          helm lint --strict examples/petstore/chart \
              -f examples/petstore/chart/ci/test-values.yaml
      # Fails instead of skipping the tests if Helm is missing
      - name: Test charts
        run: |
          helm version
          pytest charts/foca-common/tests
