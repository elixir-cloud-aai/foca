# Scan a Docker image for known vulnerabilities (and secrets) with Trivy, for
# the workflows that scan images (CI, release and weekly scan workflows; not
# in jobs with publishing credentials or signing permissions): the findings
# that have a fix are uploaded to code scanning (SARIF, unless `upload` is
# false, e.g., for pull requests from forks), so that the alerts show what
# can be acted on; findings without a fix appear once a fix is released. If
# `report` is true (weekly scan), a full report, findings without a fix
# included, is uploaded as the workflow artifact `trivy-report-<category>`
# (JSON and table), not to code scanning. Then the step fails on critical
# and high findings that have a fix (unless `fail` is false). Accepted
# findings are listed in `.trivyignore.yaml` (of the checked-out commit) and
# left out of all results. The job needs the `security-events: write`
# permission to upload to code scanning. The copies of this action in FOCA,
# cloud-registry and proTES are identical: change them together.

name: Scan image
description: Scan a Docker image with Trivy and fail on fixable critical and high findings

inputs:
  image:
    description: Image to scan (a local image or a registry reference)
    required: true
  category:
    description: Code scanning category of the results (one per image variant)
    required: true
  upload:
    description: Upload the fixable findings to code scanning ("true" or "false")
    default: "true"
  report:
    description: Upload a full report, unfixed findings included, as a workflow artifact ("true" or "false")
    default: "false"
  fail:
    description: Fail on fixable critical and high findings ("true" or "false")
    default: "true"

runs:
  using: composite
  steps:
    - name: Scan image (fixable findings)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ inputs.image }}
        trivyignores: .trivyignore.yaml
        ignore-unfixed: true
        format: sarif
        output: trivy-results.sarif
        version: v0.75.0
    - name: Upload fixable findings to code scanning
      if: inputs.upload == 'true'
      uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      with:
        sarif_file: trivy-results.sarif
        category: ${{ inputs.category }}
    - name: Scan image (full report, JSON)
      if: inputs.report == 'true'
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ inputs.image }}
        trivyignores: .trivyignore.yaml
        format: json
        output: trivy-report.json
        version: v0.75.0
        skip-setup-trivy: true
    - name: Scan image (full report, table)
      if: inputs.report == 'true'
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ inputs.image }}
        trivyignores: .trivyignore.yaml
        format: table
        output: trivy-report.txt
        version: v0.75.0
        skip-setup-trivy: true
    - name: Upload full report as workflow artifact
      if: inputs.report == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: trivy-report-${{ inputs.category }}
        path: |
          trivy-report.json
          trivy-report.txt
        if-no-files-found: error
    - name: Fail on fixable critical and high findings
      if: inputs.fail == 'true'
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ inputs.image }}
        trivyignores: .trivyignore.yaml
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: "1"
        version: v0.75.0
        skip-setup-trivy: true
