version: 2
updates:
  - package-ecosystem: pip
    directories: ["/", "/requirements"]
    target-branch: dev
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    ignore:
      # Connexion 3 requires a migration (see #188)
      - dependency-name: connexion
        update-types: ["version-update:semver-major"]
    groups:
      # setuptools-scm requires a matching vcs-versioning
      setuptools-scm:
        patterns: [setuptools-scm, vcs-versioning]
      python-dependencies:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker
    target-branch: dev
    schedule:
      interval: weekly

  # Images in the values of the petstore example's chart, which app charts
  # copy: patch updates only, as minor versions are chosen deliberately (e.g.,
  # MongoDB 8.0 refuses to start on some kernels); the dependency on the
  # library chart is local (`file://`)
  - package-ecosystem: helm
    directory: /examples/petstore/chart
    target-branch: dev
    schedule:
      interval: weekly
    ignore:
      - dependency-name: foca-common
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
