version: 2

# Docker Hub credentials for image updates, as anonymous pulls fail for
# the helm job; Dependabot secrets (not Actions secrets) with a personal
# access token of scope "Public Repo Read-only"
registries:
  dockerhub:
    type: docker-registry
    url: https://registry.hub.docker.com
    username: ${{secrets.DOCKERHUB_LOGIN}}
    password: ${{secrets.DOCKERHUB_TOKEN}}
    replaces-base: true

updates:
  # Python packages: FOCA's, those of the tools (`requirements/`), of the
  # FOCA image (`docker/requirements`) and those that the images of the
  # examples install (`examples/petstore`, `examples/gateway`)
  - package-ecosystem: pip
    directories:
      - /
      - /requirements
      - /docker/requirements
      - /examples/petstore
      - /examples/gateway
    target-branch: dev
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    ignore:
      # Connexion 3 requires a migration (see #188)
      - dependency-name: connexion
        update-types: ["version-update:semver-major"]
      # FOCA's Gunicorn settings are tested with Gunicorn 26 (`gunicorn<27`
      # in `pyproject.toml`, the version of the petstore image)
      - dependency-name: gunicorn
        update-types: ["version-update:semver-major"]
    groups:
      # setuptools-scm requires a matching vcs-versioning
      setuptools-scm:
        patterns: [setuptools-scm, vcs-versioning]
      # The ruff hook of `.pre-commit-config.yaml` must be updated with ruff
      # (checked by the lint job), so that failing updates of ruff do not
      # hold up others
      ruff:
        patterns: [ruff]
      # Likewise for semgrep (`requirements/semgrep.txt`)
      semgrep:
        patterns: [semgrep]
      python-dependencies:
        update-types: [minor, patch]

  # Actions in the workflows and in the local composite actions
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/install-chart
      - /.github/actions/test-chart
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Digests of the Python images in the Dockerfile of the FOCA image; its
  # Python versions are chosen deliberately (see the Python version policy)
  - package-ecosystem: docker
    directory: /docker
    target-branch: dev
    registries: [dockerhub]
    schedule:
      interval: weekly
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      python-images:
        patterns: [python]

  # uv in the petstore example's image (`ghcr.io`, tag and digest); its base
  # image is the FOCA image built locally
  - package-ecosystem: docker
    directory: /examples/petstore
    target-branch: dev
    schedule:
      interval: weekly
    ignore:
      - dependency-name: foca-petstore-root

  # The same in the gateway example's image
  - package-ecosystem: docker
    directory: /examples/gateway
    target-branch: dev
    schedule:
      interval: weekly
    ignore:
      - dependency-name: foca-gateway-root

  # Images in the values of the charts of the examples; app charts copy the
  # petstore's: patch updates only, as minor versions are chosen deliberately (e.g.,
  # MongoDB 8.0 refuses to start on some kernels); the dependency on the
  # library chart is local (`file://`). The snapshots of the chart tests
  # contain the images: refresh them in these PRs (see docs/helm-chart.md)
  - package-ecosystem: helm
    directories: ["/examples/petstore/chart", "/examples/gateway/chart"]
    target-branch: dev
    registries: [dockerhub]
    schedule:
      interval: weekly
    ignore:
      - dependency-name: foca-common
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
