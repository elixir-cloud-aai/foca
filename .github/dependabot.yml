version: 2
updates:
  # Also updates the pinned release tools in `requirements/release.txt`
  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    ignore:
      # Connexion 3 requires a migration (see #188)
      - dependency-name: connexion
        update-types: ["version-update:semver-major"]
    groups:
      python-dependencies:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker
    target-branch: dev
    schedule:
      interval: weekly
