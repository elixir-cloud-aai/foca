version: 2

# Docker Hub credentials for image updates, as anonymous pulls fail for
# the helm job; Dependabot secrets (not Actions secrets) with a personal
# access token of scope "Public Repo Read-only"
registries:
  dockerhub:
    type: docker-registry
    url: https://registry.hub.docker.com
    username: ${{secrets.DOCKERHUB_LOGIN}}
    password: ${{secrets.DOCKERHUB_TOKEN}}
    replaces-base: true

updates:
  - package-ecosystem: pip
    directories: ["/", "/requirements"]
    target-branch: dev
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    ignore:
      # Connexion 3 requires a migration (see #188)
      - dependency-name: connexion
        update-types: ["version-update:semver-major"]
    groups:
      # setuptools-scm requires a matching vcs-versioning
      setuptools-scm:
        patterns: [setuptools-scm, vcs-versioning]
      # The ruff hook of `.pre-commit-config.yaml` must be updated with ruff
      # (checked by the lint job), so that failing updates of ruff do not
      # hold up others
      ruff:
        patterns: [ruff]
      # Likewise for semgrep (`requirements/semgrep.txt`)
      semgrep:
        patterns: [semgrep]
      python-dependencies:
        update-types: [minor, patch]

  # Actions in the workflows and in the local composite actions
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/install-chart
      - /.github/actions/test-chart
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker
    target-branch: dev
    registries: [dockerhub]
    schedule:
      interval: weekly

  # Images in the values of the petstore example's chart, which app charts
  # copy: patch updates only, as minor versions are chosen deliberately (e.g.,
  # MongoDB 8.0 refuses to start on some kernels); the dependency on the
  # library chart is local (`file://`). The snapshots of the chart tests
  # contain the images: refresh them in these PRs (see docs/helm-chart.md)
  - package-ecosystem: helm
    directory: /examples/petstore/chart
    target-branch: dev
    registries: [dockerhub]
    schedule:
      interval: weekly
    ignore:
      - dependency-name: foca-common
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
