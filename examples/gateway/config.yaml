server:
    host: '0.0.0.0'
    port: 8080
    debug: False
    testing: False
    # Bytes; refuse larger requests before they are parsed
    max_content_length: 65536
    # Set explicitly, as `tests/integration_gateway_tests.py` checks it; the
    # service `app-no-trust` of `docker-compose.yaml` turns it off. For that test
    # only: don't copy this without a proxy that replaces what clients send
    # in the header or rejects it, as they could otherwise choose the identifiers in logs and audit events
    request_id:
        trust_incoming: True

api:
    specs:
        gateway:
            path: gateway.yaml
            append: null
            add_operation_fields:
                x-openapi-router-controller: controllers
            connexion:
                strict_validation: True
                validate_responses: False
                options:
                    swagger_ui: False
                    serve_spec: True

# The plugins' store is in the first database
db:
    host: mongodb
    port: 27017
    dbs:
        gateway:
            collections: null

# Deployments set the broker URL via `CELERY_BROKER_URL` (e.g., the Helm
# chart's `broker.existingSecret`)
jobs:
    host: rabbitmq
    port: 5672
    backend: rpc://
    include:
        - tasks

# The key secret of the plugins' store comes from the environment
# (`FOCA_PLUGINS_STORE_KEY_SECRET`, e.g., the chart's
# `pluginStore.existingSecret`), as it must not be in a config file
plugins:
    available:
        org.example.gateway.stamp:
            config:
                stamp: stamped by the plugin
    pipeline:
        - org.example.gateway.stamp
        - foca.routing.ordered
