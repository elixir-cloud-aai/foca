services:

  # build app image based on current FOCA root image
  foca-petstore-access-control-root:
    build:
      context: ../../
      dockerfile: docker/Dockerfile
      args:
        PY_IMAGE: ${PETSTORE_PY_IMAGE:-3.13-slim-trixie}
    image: foca-petstore-access-control-root:latest
    restart: "no"

  app:
    image: elixircloud/foca-petstore-access-control:latest
    depends_on:
      - foca-petstore-access-control-root
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    links:
      - mongodb
    command: bash -c "python app.py"
    ports:
      - "80:8080"

  mongodb:
    # MongoDB 8.0 refuses to start on Linux kernels 6.19 to 7.0.13
    # (https://jira.mongodb.org/browse/SERVER-121912). MongoDB 7.0 cannot
    # use data written by MongoDB 8.0: delete the example's data directory
    # (see `volumes`) if it was created with an earlier version of this file
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - ./data/petstore-access-control/db:/data/db
    # Published on the loopback interface only, for local inspection; the
    # app connects via the Compose network. MongoDB runs without
    # authentication here: do not publish it on other interfaces
    ports:
      - "127.0.0.1:27017:27017"
