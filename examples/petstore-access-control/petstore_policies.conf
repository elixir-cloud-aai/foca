# Access control model for the Petstore example, based on FOCA's reference
# model for resource-scoped roles
# (foca/security/access_control/api/resource_role_model.conf).
#
# Policy rules managed on startup (`security.access_control.policies` in
# `config.yaml`):
#
#   p, *, /pets, (GET)|(POST)              # any authenticated user
#   p, owner, /pets/:id, (GET)|(DELETE)    # owners of a pet
#
# Ownership rules are added by the `addPet` controller for the creator of a
# pet, e.g.:
#
#   g2, user:alice, owner, /pets/0         # alice owns pet 0
#
# Subjects with the `admin` role may do everything, including managing rules
# via the permissions API, e.g.:
#
#   g, user:bob, admin                     # bob is an admin

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _
g2 = _, _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, "admin") || ((p.sub == "*" || g(r.sub, p.sub) || g2(r.sub, p.sub, r.obj)) && keyMatch2(r.obj, p.obj) && regexMatch(r.act, "^(" + p.act + ")$"))
