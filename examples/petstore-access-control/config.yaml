server:
    host: '0.0.0.0'
    port: 8080
    # Enable for local development only: the debugger allows executing
    # arbitrary code
    debug: False
    testing: False

security:
    auth:
        add_key_to_claims: True
        allow_expired: False
        # Audiences of the app (`aud` claim, e.g., its client ID at the
        # issuers); required if `issuers` are set, unless audience validation
        # is disabled with `verify_audience: False` (not recommended)
        audience:
          - petstore
        claim_identity: sub
        algorithms:
          - RS256
        # Trusted token issuers (`iss` claim); tokens of other issuers are
        # rejected
        issuers:
          - https://login.example.org/oidc/
    access_control:
        enabled: True
        model: petstore_policies.conf
        enforce: True
        # Policy rules the app relies on, added on startup unless stored
        # already; ownership rules are added by the controllers
        policies:
          - [p, "*", /pets, "(GET)|(POST)"]
          - [p, owner, "/pets/:id", "(GET)|(DELETE)"]
        # Serve Swagger UI and specification of the permissions API
        api_swagger_ui: True
        api_serve_spec: True
        # Map group claims of the identity provider to roles, e.g., to make
        # members of a group admins:
        # claim_groups: eduperson_entitlement
        # group_mapping:
        #     "urn:example:group:petstore-admins": admin

api:
    specs:
        - path: petstore-access-control.yaml
          append:
            - security:
              - bearerAuth: []
          add_security_fields:
              x-bearerInfoFunc: foca.security.auth.validate_token
          add_operation_fields:
              x-openapi-router-controller: controllers
          connexion:
              strict_validation: True
              validate_responses: False
              options:
                  swagger_ui: True
                  serve_spec: True

db:
    host: mongodb
    port: 27017
    dbs:
        petstore-access-control:
            collections:
                pets:
                    indexes:
                        - keys:
                              id: 1
                          options:
                              unique: True
                counters:
                    indexes: null

exceptions:
    mapping: exceptions.exceptions
