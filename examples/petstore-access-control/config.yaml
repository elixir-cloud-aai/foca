server:
    host: '0.0.0.0'
    port: 8080
    # Enable for local development only: the debugger allows executing
    # arbitrary code
    debug: False
    testing: False

security:
    auth:
        add_key_to_claims: True
        allow_expired: False
        # Audiences of the app (`aud` claim, e.g., its client ID at the
        # issuers); required if `issuers` are set, unless audience validation
        # is disabled with `verify_audience: False` (not recommended, unless
        # `clients` are restricted instead)
        audience:
          - petstore
        claim_identity: sub
        algorithms:
          - RS256
        # Trusted token issuers (`iss` claim); tokens of other issuers are
        # rejected
        issuers:
          - https://login.example.org/oidc/
        # Accepted token types (`typ` header); by default, only OAuth 2.0
        # access tokens as per RFC 9068, so that other JWTs (e.g., ID tokens)
        # are rejected; set `verify_token_type: False` only if the issuers do
        # not set the `typ` header of their access tokens (not recommended)
        token_types:
          - at+jwt
          - application/at+jwt
        # Service clients calling with client-credentials tokens of their
        # own; `pet-shop` may name the user it acts for in the
        # `X-On-Behalf-Of` header, who then owns the pets it adds (only allow
        # fully trusted clients to act for users)
        service_clients:
          - client_id: pet-shop
            on_behalf_of: True
        on_behalf_of_header: X-On-Behalf-Of
    access_control:
        enabled: True
        model: petstore_policies.conf
        enforce: True
        # Policy rules the app relies on, managed on startup (they cannot be
        # changed via the permissions API); ownership rules are added by the
        # controllers; roles on a pet also apply to its sub-paths (e.g.,
        # `/pets/0/permissions`, cf. `resource_roles_cover_subpaths`); named,
        # so that config overlays can add, change or remove rules by name
        policies:
            list-add-pets: [p, "*", /pets, "(GET)|(POST)"]
            owners-read-delete: [p, owner, "/pets/:id", "(GET)|(DELETE)"]
            owners-list-roles: [p, owner, "/pets/:id/permissions", GET]
            owners-manage-roles:
                [p, owner, "/pets/:id/permissions/users/:userId", "(PUT)|(DELETE)"]
            maintainers-read: [p, maintainer, "/pets/:id", GET]
        # Serve Swagger UI and specification of the permissions API
        api_swagger_ui: True
        api_serve_spec: True
        # Map group claims of the identity provider to roles, e.g., to make
        # members of a group admins:
        # claim_groups: eduperson_entitlement
        # group_mapping:
        #     "urn:example:group:petstore-admins": admin

api:
    # Named specs, so that config overlays can change a spec by its name,
    # e.g., add `patches`
    specs:
        petstore:
            path: petstore-access-control.yaml
            append:
              - security:
                - bearerAuth: []
            add_security_fields:
                x-bearerInfoFunc: foca.security.auth.validate_token
            add_operation_fields:
                x-openapi-router-controller: controllers
            connexion:
                strict_validation: True
                validate_responses: False
                options:
                    swagger_ui: True
                    serve_spec: True

db:
    host: mongodb
    port: 27017
    dbs:
        petstore-access-control:
            collections:
                pets:
                    indexes:
                        - keys:
                              id: 1
                          options:
                              unique: True
                counters:
                    indexes: null

exceptions:
    mapping: exceptions.exceptions
