server:
    host: '0.0.0.0'
    port: 8080
    # Enable for local development only: the debugger allows executing
    # arbitrary code
    debug: False
    environment: production
    testing: False
    use_reloader: False

security:
    auth:
        required: True
        add_key_to_claims: True
        allow_expired: False
        audience: null
        claim_identity: sub
        algorithms:
          - RS256
        # Trusted token issuers (`iss` claim); tokens of other issuers are
        # rejected
        issuers:
          - https://login.example.org/oidc/
    access_control:
        model: petstore_policies.conf
        enforce: True
        # Serve Swagger UI and specification of the permissions API
        api_swagger_ui: True
        api_serve_spec: True
        # Map group claims of the identity provider to roles, e.g., to make
        # members of a group admins:
        # claim_groups: eduperson_entitlement
        # group_mapping:
        #     "urn:example:group:petstore-admins": admin

api:
    specs:
        - path: petstore-access-control.yaml
          append:
            - security:
              - bearerAuth: []
          add_security_fields:
              x-bearerInfoFunc: foca.security.auth.validate_token
          add_operation_fields:
              x-openapi-router-controller: controllers
          connexion:
              strict_validation: True
              validate_responses: False
              options:
                  swagger_ui: True
                  serve_spec: True

db:
    host: mongodb
    port: 27017
    dbs:
        petstore-access-control:
            collections:
                pets:
                    indexes:
                        - keys:
                              id: 1
                          options:
                              unique: True
                counters:
                    indexes: null

exceptions:
    required_members: [['message'], ['code']]
    status_member: ['code']
    exceptions: exceptions.exceptions
