server:
    host: '0.0.0.0'
    port: 8080
    debug: True
    environment: development
    testing: False
    use_reloader: True

security:
    auth:
        add_key_to_claims: True
        allow_expired: False
        audience: null
        claim_identity: sub
        algorithms:
          - RS256
        # Trusted token issuers (`iss` claim); tokens of other issuers are
        # rejected
        issuers:
          - https://login.example.org/oidc/

api:
    specs:
        - path: petstore.yaml
          append: null
          add_operation_fields:
              x-openapi-router-controller: controllers
          connexion:
              strict_validation: True
              validate_responses: False
              options:
                  swagger_ui: True
                  serve_spec: True

db:
    host: mongodb
    port: 27017
    dbs:
        petstore:
            collections:
                pets:
                    indexes: null

exceptions:
    mapping: exceptions.exceptions
