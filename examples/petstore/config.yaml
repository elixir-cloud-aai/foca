server:
    host: '0.0.0.0'
    port: 8080
    # Debug mode exposes an interactive debugger; local development only
    debug: False
    testing: False

security:
    auth:
        add_key_to_claims: True
        allow_expired: False
        # Audiences of the app (`aud` claim, e.g., its client ID at the
        # issuers); required if `issuers` are set, unless audience validation
        # is disabled with `verify_audience: False` (not recommended, unless
        # `clients` are restricted instead)
        audience:
          - petstore
        claim_identity: sub
        algorithms:
          - RS256
        # Trusted token issuers (`iss` claim); tokens of other issuers are
        # rejected
        issuers:
          - https://login.example.org/oidc/
        # Accepted token types (`typ` header); by default, only OAuth 2.0
        # access tokens as per RFC 9068, so that other JWTs (e.g., ID tokens)
        # are rejected; set `verify_token_type: False` only if the issuers do
        # not set the `typ` header of their access tokens (not recommended)
        token_types:
          - at+jwt
          - application/at+jwt

api:
    specs:
        - path: petstore.yaml
          append: null
          add_operation_fields:
              x-openapi-router-controller: controllers
          connexion:
              strict_validation: True
              validate_responses: False
              options:
                  swagger_ui: True
                  serve_spec: True

db:
    host: mongodb
    port: 27017
    dbs:
        petstore:
            collections:
                pets:
                    indexes: null

exceptions:
    mapping: exceptions.exceptions
