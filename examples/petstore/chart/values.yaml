# Default values for petstore.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Resource names are derived from the release name: `<release>-petstore` (or
# `<release>` if it contains `petstore`) for the app and `<that name>-mongodb`
# for MongoDB; `nameOverride` replaces the chart name, `fullnameOverride` the
# derived app name. Set them at installation only: changing them later
# changes the pod selectors, which cannot be upgraded
nameOverride: ""
fullnameOverride: ""

# Public host name of the app (of the Ingress, HTTPRoute or OpenShift Route)
hostName: ""

# App config overriding the base config in the image (`config.yaml` of the
# example); mappings are merged recursively, other values (including lists)
# are replaced. Stored in a ConfigMap, so must not contain secrets. Examples:
config: {}
#   security:
#     auth:
#       issuers: ["https://login.example.org/oidc/"]
#       audience: ["petstore"]
#   log:
#     handlers:
#       console:
#         level: 20

petstore:
  # Image repository; may include a tag or digest instead of setting `tag`.
  # The example's image is not published; it serves the app with Gunicorn.
  # Build it in `examples/petstore` with
  # `docker compose build foca-petstore-root` (the FOCA image) and
  # `docker build -t foca-petstore .`, and load it into the cluster (e.g.,
  # `kind load docker-image foca-petstore`)
  image: foca-petstore
  # Image tag; defaults to the chart's `appVersion`
  tag: ""
  # Pull policy of the image (`Always`, `IfNotPresent` or `Never`);
  # `IfNotPresent` for the locally built image, `Always` if not set
  imagePullPolicy: IfNotPresent
  # Path of the app's startup, readiness and liveness probes: the served
  # OpenAPI spec (no authentication or database access, and lighter than
  # the Swagger UI, `/ui/`)
  probePath: /openapi.json
  # Number of the app's pods; with more than one, the app stays available
  # while a pod is restarted or evicted (e.g., on node drains). FOCA apps
  # support several pods (see the chart docs for the caveats,
  # https://foca.readthedocs.io/en/latest/helm-chart/#several-replicas)
  replicas: 1
  # PodDisruptionBudget of the app's pods, so that voluntary disruptions
  # (e.g., node drains) evict at most `maxUnavailable` pods at once (1 if
  # neither it nor `minAvailable` is set), or keep at least `minAvailable`
  # (a number or a percentage, e.g., `50%`; set at most one of them). Only
  # rendered with more than one replica, as it would block node drains
  # otherwise
  podDisruptionBudget:
    enabled: true
    minAvailable: null
    maxUnavailable: null
  # The app is exposed for `hostName` via one of: an Ingress (`ingress`), a
  # Gateway API HTTPRoute (`httpRoute`; disable the Ingress to enable it) or,
  # if neither is enabled and the cluster serves Routes, an OpenShift Route
  # (`route`). See the chart docs for the values of common ingress
  # controllers and Gateway implementations
  # (https://foca.readthedocs.io/en/latest/helm-chart/#exposing-the-app)
  ingress:
    enabled: true
    # Ingress class (`spec.ingressClassName`); the cluster's default class if
    # empty
    className: ""
    # Annotations of the Ingress, e.g., for the ingress controller's size
    # limit of request bodies, TLS redirect or rate limits; the chart sets
    # none for particular controllers (see the chart docs for examples).
    # They take precedence over those set by the chart for `https`; `null`
    # removes one of these
    annotations: {}
    https:
      # Request a certificate from cert-manager (via `issuer`, a
      # ClusterIssuer) and serve HTTPS
      enabled: false
      issuer: letsencrypt-prod
  # Gateway API HTTPRoute (`gateway.networking.k8s.io/v1`) for `hostName`,
  # attached to an existing Gateway, whose listener terminates TLS; requires
  # `ingress.enabled: false`
  httpRoute:
    enabled: false
    # Annotations of the HTTPRoute
    annotations: {}
    # Gateways (or listeners, via `sectionName` or `port`) to attach to;
    # required if enabled, e.g., the HTTPS listener of a shared Gateway:
    # `[{name: gateway, namespace: gateway-system, sectionName: https}]`.
    # The Gateway's listener must allow routes from the release's namespace
    parentRefs: []
    # Filters of the route's rule (`HTTPRouteFilter`s), e.g., an
    # `ExtensionRef` to a resource of the Gateway implementation that limits
    # body sizes or rates; the Gateway API has no standard for these, so the
    # app's `config.server.max_content_length` stays the enforcing limit
    filters: []
    # A second HTTPRoute (`<app name>-https-redirect`) that redirects HTTP to
    # HTTPS (`301`), attached to the Gateway's HTTP listener(s) in
    # `parentRefs` (required if enabled), e.g.,
    # `[{name: gateway, namespace: gateway-system, sectionName: http}]`; they
    # must not attach to the listeners of `httpRoute.parentRefs` (set
    # `sectionName` in both, or `port` in both). It has no annotations
    httpsRedirect:
      enabled: false
      parentRefs: []
  # OpenShift Route for all paths (TLS at the router, which redirects HTTP
  # to HTTPS)
  route:
    # Create the Route if neither the Ingress nor the HTTPRoute is enabled
    # and the cluster serves Routes; false, e.g., for a Route or HTTPRoute
    # of your own
    enabled: true
    # Annotations of the Route, e.g., for rate limits of the router
    # (`haproxy.router.openshift.io/rate-limit-connections`)
    annotations: {}
  # NetworkPolicy allowing connections to the app only from `ingressFrom`
  # (and the kubelet's probes); clusters without NetworkPolicy support ignore
  # it. Disabled by default: before enabling it, make `ingressFrom` match the
  # pods of the ingress controller or Gateway
  networkPolicy:
    enabled: false
    # NetworkPolicy peers (`spec.ingress[].from`) allowed to connect to the
    # app: none by default, as they depend on the cluster. Set them when
    # enabling the policy, which fails to render without peers (which would
    # allow all sources). For the peers of common ingress controllers and
    # Gateways, see
    # https://foca.readthedocs.io/en/latest/helm-chart/#networkpolicy-peers
    ingressFrom: []
  # Security contexts of the pod and the container; the FOCA image runs as
  # user 1000, and with a read-only root file system, temporary files go to
  # an `emptyDir` at `/tmp`. On OpenShift, `runAsUser`, `runAsGroup` and
  # `fsGroup` are omitted, as OpenShift assigns them
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi
  # Size limit of the `emptyDir` at `/tmp` (the pod is evicted if it is
  # exceeded): a quantity (e.g., `64Mi`) or a number of bytes; `null` for none
  tmpSizeLimit: 64Mi
  # Seconds that the app keeps serving after its pod is deleted, before it
  # shuts down (`preStop` hook), so that the ingress controller and Service
  # stop sending requests to it first; 0: no delay (no hook)
  preStopSleepSeconds: 5
  # Gunicorn, the image's WSGI server (passed via `GUNICORN_CMD_ARGS`); omit
  # this section if the image does not run Gunicorn. Each worker loads the
  # whole app, so raise the memory in `resources` before raising `workers`
  gunicorn:
    # Worker processes, and threads per worker (requests served at once)
    workers: 1
    threads: 4
    # Seconds after which workers whose main loop does not respond are
    # restarted (requests run in threads, so slow requests don't count)
    timeout: 30
    # Seconds that workers get to finish requests on shutdown (after
    # `preStopSleepSeconds`); the pod's termination grace period is both
    # plus 10 seconds
    gracefulTimeout: 20
    # Seconds after which idle keep-alive connections are closed (0: no
    # keep-alive); keep it longer than the idle timeout of the proxy's
    # connections to the app (see the chart docs), which would otherwise
    # reuse connections as they are closed (failing requests with `502`)
    keepalive: 100
    # Further Gunicorn options, e.g., `["--access-logfile", "-"]` for an
    # access log; rendering fails for `--bind`/`-b` (the chart's ports are
    # 8080), `--preload` (MongoDB clients must be created after forking) and
    # `--graceful-timeout` (set `gracefulTimeout`)
    extraArgs: []

mongodb:
  # Deploy MongoDB with the app; if false, set the host (and port) of an
  # external MongoDB in `config.db`, and its app user's credentials via
  # `auth.existingSecret`
  enabled: true
  # MongoDB 8.0 refuses to start on Linux kernels 6.19 to 7.0.13
  # (https://jira.mongodb.org/browse/SERVER-121912)
  # Pinned to a patch version (or pin a digest), so that restarts don't
  # change it; update it with the chart (Dependabot proposes patch updates)
  image: docker.io/library/mongo:7.0.45
  # Pull policy of the image (`Always`, `IfNotPresent` or `Never`)
  imagePullPolicy: IfNotPresent
  auth:
    # Require credentials (set `existingSecret`); enforced on every start,
    # but users are only created when MongoDB starts with an empty data
    # directory, so create them first for existing databases. Without
    # authentication, any pod that can reach the MongoDB service can read
    # and modify the data, so disable it explicitly only if that is
    # acceptable
    enabled: true
    # Name of an existing Secret with keys `root-username` and
    # `root-password` (MongoDB root user; not needed for an external MongoDB)
    # and `username` and `password` (app user, created with access to the
    # app's database)
    existingSecret: ""
  # NetworkPolicy allowing connections to MongoDB only from the app's pods of
  # this release (and the kubelet's probes); clusters without NetworkPolicy
  # support ignore it
  networkPolicy:
    enabled: true
  # Volume with MongoDB's data: a PersistentVolumeClaim (`<app name>-mongodb`)
  # of `size`, with `accessModes` and `storageClass` (the cluster's default
  # class if empty, `-` for no dynamic provisioning), or the existing claim
  # `existingClaim`. If disabled, the data is kept in an `emptyDir` (limited
  # to `size`) and lost when MongoDB's pod is replaced, e.g., for tests.
  # With `resourcePolicy: keep`, Helm keeps the claim (and the database) when
  # the release is uninstalled, or when the claim is removed from it (by
  # disabling persistence or switching to an existing claim, once a deployed
  # revision has set the annotation); reinstalling the release with the same
  # name and namespace uses it again. Delete the claim by hand to remove the
  # data. Empty: Helm deletes the claim.
  # Replaces `volumeSize`, the setting up to foca-common 0.1.0 (deprecated
  # since 0.2.0; it still sets `size`, but rendering fails if both are set)
  persistence:
    enabled: true
    size: 1Gi
    accessModes: ["ReadWriteOnce"]
    storageClass: ""
    existingClaim: ""
    resourcePolicy: keep
  # Security contexts of the pod and the container; the image starts as root
  # and switches to user `mongodb` (999), so the user is set here, and
  # `fsGroup` makes the data volume writable for it. On OpenShift,
  # `runAsUser`, `runAsGroup` and `fsGroup` are omitted, as OpenShift assigns
  # them
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 512Mi
  # Size limit of the `emptyDir` at `/tmp` (the pod is evicted if it is
  # exceeded): a quantity (e.g., `64Mi`) or a number of bytes; `null` for none
  tmpSizeLimit: 64Mi

# Celery worker for background tasks (FOCA's `jobs` config): a Deployment
# with the app's image, config overlay, MongoDB credentials and security
# contexts, connected to the broker via `broker.existingSecret`. The
# example's image has a worker entry point (`worker.py`), but no tasks
worker:
  # Deploy the worker (requires `broker.existingSecret`)
  enabled: false
  # Command of the worker's container (required if enabled), e.g.,
  # `["python", "-m", "celery", "--app", "worker:celery_app", "worker"]`;
  # set `--concurrency` to fit `resources` (by default, Celery starts one
  # process per CPU of the node)
  command: []
  replicas: 1
  # Probes of the worker's container (Kubernetes probe specs; none by
  # default, so its pods are ready once started, also while Celery retries
  # to connect to the broker), e.g., an `exec` probe that runs
  # `celery inspect ping` for the pod's worker; such a check starts Python
  # and creates the app, so give it long periods and timeouts
  readinessProbe: {}
  livenessProbe: {}
  # Seconds that the worker gets to finish running tasks after its pod is
  # deleted (Celery's warm shutdown), before it is killed
  terminationGracePeriodSeconds: 30
  resources:
    limits:
      cpu: 100m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 256Mi
  # Size limit of the `emptyDir` at `/tmp` (the pod is evicted if it is
  # exceeded): a quantity (e.g., `64Mi`) or a number of bytes; `null` for none
  tmpSizeLimit: 64Mi

# Message broker of Celery
broker:
  # Deploy RabbitMQ as the broker (one pod), which keeps queued tasks in a
  # PersistentVolumeClaim (see `persistence`), so that they survive restarts
  # of its pod (e.g., on upgrades or node failures)
  enabled: false
  # Name of an existing Secret with the key `broker-url`, the broker URL
  # (passed to the app and the worker as `CELERY_BROKER_URL`), optionally
  # `result-backend` (`CELERY_RESULT_BACKEND`; by default `jobs.backend` of
  # the config) and, for the bundled RabbitMQ, `username` and `password` of
  # its user, which its URL must contain, e.g.,
  # `pyamqp://<username>:<password>@<app name>-broker:5672//` (the Service
  # is named like the app's resources, see `fullnameOverride`, with the
  # suffix `-broker`; URL-encode reserved characters of the credentials).
  # Required if `worker.enabled` or `enabled`; for an external broker, set it
  # without enabling either to pass the broker URL to the app only
  existingSecret: ""
  # Pinned to a patch version (or pin a digest), so that restarts don't
  # change it; update it with the chart (Dependabot proposes patch updates)
  image: docker.io/library/rabbitmq:4.3.7
  # Pull policy of the image (`Always`, `IfNotPresent` or `Never`)
  imagePullPolicy: IfNotPresent
  # NetworkPolicy allowing connections to the broker only from the app's and
  # the worker's pods of this release (and the kubelet's probes); clusters
  # without NetworkPolicy support ignore it
  networkPolicy:
    enabled: true
  # Security contexts of the pod and the container; the image runs as user
  # `rabbitmq` (999), and `fsGroup` makes the data volume writable for it.
  # On OpenShift, `runAsUser`, `runAsGroup` and `fsGroup` are omitted, as
  # OpenShift assigns them
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    readOnlyRootFilesystem: true
  resources:
    limits:
      cpu: 200m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 512Mi
  # Volume with the broker's data (queued tasks; Celery's queues are durable
  # and its task messages persistent): a PersistentVolumeClaim
  # (`<app name>-broker`) of `size`, with `accessModes` and `storageClass`
  # (the cluster's default class if empty, `-` for no dynamic provisioning),
  # or the existing claim `existingClaim`. RabbitMQ creates its user from
  # `existingSecret` only when it starts with empty data: after changing the
  # Secret's password, also change the user's (`rabbitmqctl change_password`
  # in the broker's pod). If disabled, the data is kept in an `emptyDir`, and
  # queued tasks are lost when the broker's pod is replaced. Helm deletes the
  # claim when the release is uninstalled, unless `resourcePolicy` is `keep`
  persistence:
    enabled: true
    size: 1Gi
    accessModes: ["ReadWriteOnce"]
    storageClass: ""
    existingClaim: ""
    resourcePolicy: ""
  # Size limits of the `emptyDir`s with the broker's home (and, without
  # `persistence`, its data) and at `/tmp` (the pod is evicted if they are
  # exceeded): quantities (e.g., `1Gi`) or numbers of bytes; `null` for none
  dataSizeLimit: 1Gi
  tmpSizeLimit: 64Mi
