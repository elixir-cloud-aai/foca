[build-system]
# setuptools 83 fixes CVE-2026-59890 (exclusions of `MANIFEST.in` bypassed in
# sdists); setuptools-scm 9 for `[tool.setuptools_scm.scm.git]`
# (describe_command)
requires = ["setuptools>=83", "setuptools-scm>=9"]
build-backend = "setuptools.build_meta"

[project]
name = "foca"
dynamic = ["version"]
description = "Archetype for OpenAPI microservices based on Flask and Connexion"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "ELIXIR On-Cloud", email = "cloud-service@elixir-europe.org" },
    { name = "Alexander Kanitz" },
]
maintainers = [
    { name = "ELIXIR On-Cloud", email = "cloud-service@elixir-europe.org" },
]
keywords = ["rest", "api", "app", "openapi", "python", "microservice"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "addict~=2.2",
    "celery>=5.4,<6",
    # Not used directly (via requests); 2026.10.19 fixes GHSA-6q48-6c7w-9gw2
    # (compromised emSign intermediate CAs)
    "certifi>=2026.10.19",
    "connexion>=2.15.1,<3",
    "cryptography>=50",
    "Flask>=3.1.3,<4",
    "Flask-Cors>=6.0.5,<7",
    "idna>=3.15,<4",  # foca/utils/urls.py; 3.15 fixes CVE-2026-45409
    "jsonschema>=4.17.3,<5",
    "pycasbin>=2.8,<2.9",  # adapter uses Casbin internals (_append_rule)
    "pydantic>=2.7,<3",
    "PyJWT>=2.15,<3",  # 2.15 fixes CVE-2026-48523, CVE-2026-32597
    # 4.18.2 fixes CVE-2026-88029, CVE-2026-96747, CVE-2026-96748 (URI
    # parsing), CVE-2026-96749
    "pymongo>=4.18.2,<5",
    "PyYAML>=6.0.1,<7",
    "requests>=2.33.0,<3",  # 2.33.0 fixes CVE-2026-25645
    "swagger-ui-bundle>=1.1,<2",
    "Werkzeug>=3.1.9,<4",  # 3.1.9 fixes CVE-2026-27199, CVE-2026-102598
]

[project.optional-dependencies]
dev = [
    # The ast-grep hook of `.pre-commit-config.yaml` uses this one
    "ast-grep-cli>=0.51",
    "coverage>=7.6",
    "mongomock>=4.3",
    "mypy>=1.13",
    "pre-commit>=4",
    "pytest>=8.3",
    "ruff>=0.17",
    "types-PyYAML",
    "types-requests",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7,<10",
    # older versions fail with pymdown-extensions 12
    "mkdocstrings[python]>=1.0.8,<2",
]

[project.urls]
Repository = "https://github.com/elixir-cloud-aai/foca"
Documentation = "https://foca.readthedocs.io"
Tracker = "https://github.com/elixir-cloud-aai/foca/issues"
"ELIXIR On-Cloud" = "https://elixir-on.cloud/"

[tool.setuptools_scm]
# Version from git tags (`vX.Y.Z`); see "Versioning and releases" in
# docs/contributing.md. Only these tags, not those of the Helm library
# chart (`chart-vX.Y.Z`)
tag_regex = "^v(?P<version>[0-9]+(?:\\.[0-9]+)*(?:(?:a|b|rc)[0-9]+)?)$"

[tool.setuptools_scm.scm.git]
describe_command = "git describe --dirty --tags --long --abbrev=40 --match 'v[0-9]*'"

[tool.setuptools.packages.find]
include = ["foca*"]

[tool.setuptools.package-data]
"foca" = ["py.typed"]
"foca.utils" = ["*.yaml"]
"foca.security.access_control.api" = ["*.yaml", "*.conf"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "G",    # flake8-logging-format
    "I",    # isort
    "PL",   # Pylint
    "RUF",  # Ruff-specific rules
    "S",    # flake8-bandit (security)
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    # Complexity limits; refactoring is tracked separately
    "PLR0912",  # too-many-branches
    "PLR0913",  # too-many-arguments
    "PLR0915",  # too-many-statements
    "PLR0917",  # too-many-positional-arguments
    # Flags HTTP status codes and Casbin rule lengths, which are clear as is
    "PLR2004",  # magic-value-comparison
    # setattr() is used deliberately for dynamic attributes (e.g., on configs)
    "B010",     # set-attr-with-constant
]

[tool.ruff.lint.per-file-ignores]
# Tests use `assert`
"tests/**" = ["S101"]
"charts/*/tests/**" = ["S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.coverage.run]
source = ["foca"]

[tool.coverage.report]
# Excluded by default only since coverage 7.10; the dev extra allows 7.6
exclude_also = ["if (typing\\.)?TYPE_CHECKING:"]
# `coverage report` and `coverage xml` (CI) fail below 100%; Codecov's
# targets are the same (`codecov.yml`)
fail_under = 100

[tool.mypy]
files = ["foca", "scripts", "tests"]
python_version = "3.11"
# Complete type hints: all functions annotated, generic types parametrized
disallow_untyped_defs = true
disallow_any_generics = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
# Tests of the package; those of the Helm charts (`charts/*/tests`) need
# Helm and run separately (see `.github/workflows/charts.yml`)
testpaths = ["tests"]
markers = [
    "mongodb: needs a MongoDB server on localhost:12345 (deselect with '-m \"not mongodb\"')",
]
filterwarnings = [
    # Connexion 2 uses deprecated jsonschema APIs
    "ignore:jsonschema\\.(RefResolver|exceptions\\.RefResolutionError) is deprecated:DeprecationWarning",
    "ignore:Accessing jsonschema\\.draft4_format_checker is deprecated:DeprecationWarning",
    "ignore:Passing a schema to Validator\\.iter_errors is deprecated:DeprecationWarning",
]
