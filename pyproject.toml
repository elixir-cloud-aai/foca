[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "foca"
dynamic = ["version"]
description = "Archetype for OpenAPI microservices based on Flask and Connexion"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "ELIXIR Cloud & AAI", email = "alexander.kanitz@alumni.ethz.ch" },
]
maintainers = [
    { name = "Alexander Kanitz", email = "alexander.kanitz@alumni.ethz.ch" },
]
keywords = ["rest", "api", "app", "openapi", "python", "microservice"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "addict~=2.2",
    "celery>=5.4,<6",
    "connexion>=2.15.1,<3",
    "cryptography>=50",
    "Flask>=3.1.3,<4",
    "flask-authz>=2.5.1,<2.8",
    "Flask-Cors>=6.0.5,<7",
    "Flask-PyMongo>=3.0,<4",
    "pydantic>=2.7,<3",
    "PyJWT>=2.10,<3",
    "pymongo>=4.7,<5",
    "PyYAML>=6.0,<7",
    "requests>=2.32,<3",
    "swagger-ui-bundle>=1.1,<2",
    "typing_extensions>=4.12",
    "Werkzeug>=3.1.5,<4",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.6",
    "flake8>=7.1",
    "mongomock>=4.3",
    "mypy>=1.13",
    "pytest>=8.3",
    "types-PyYAML",
    "types-requests",
]
docs = [
    "Sphinx>=8",
    "sphinx-rtd-theme>=3",
]

[project.urls]
Repository = "https://github.com/elixir-cloud-aai/foca"
Documentation = "https://foca.readthedocs.io"
Tracker = "https://github.com/elixir-cloud-aai/foca/issues"
"ELIXIR Cloud & AAI" = "https://elixir-europe.github.io/cloud/"

[tool.setuptools.dynamic]
version = { attr = "foca.version.__version__" }

[tool.setuptools.packages.find]
include = ["foca*"]

[tool.setuptools.package-data]
"foca" = ["py.typed"]
"foca.security.access_control.api" = ["*.yaml", "*.conf"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
