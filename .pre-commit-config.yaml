# Install hooks with `pre-commit install`; run on all files with
# `pre-commit run --all-files`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
        # Deliberately malformed YAML for negative tests; Helm templates
        # (not YAML before rendering) and their rendered snapshots
        exclude: >-
          (?x)^(
            tests/test_files/invalid_conf\.yaml|
            (charts/[^/]+|examples/petstore/chart)/templates/.*|
            charts/[^/]+/tests/__snapshots__/.*
          )$
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
