# Semgrep rules for security issues that ruff's bandit rules (`S`) do not
# cover: ruff flags `eval()`, `exec()`, `yaml.load()` with unsafe loaders and
# `verify=False` as an argument of requests calls; `yaml-unsafe-load` and
# `tls-verification-disabled` cover the variants it misses. Test cases are in
# `foca.py` and `foca.test.yaml` (`cd .semgrep && semgrep --test .`); the
# scoping by `paths` can't be tested there. The rules and their tests are
# shared with FOCA apps (proTES, proWES, trs-filer, Cloud Registry): keep them
# identical there; `paths` are per repository
rules:
  - id: flask-debug-enabled
    languages: [generic]
    severity: ERROR
    message: >-
      Flask debug mode allows executing arbitrary code; only enable it for
      local development, in an overlay config (`FOCA_CONFIG_OVERLAY`)
    # All YAML files (FOCA configs of the templates and examples, and charts),
    # but test configs, which may enable debug mode
    paths:
      include:
        - "*.yaml"
        - "*.yml"
      exclude:
        - "tests/"
    pattern-regex: (?im)^\s*debug:\s*['"]?(true|yes|on|1)['"]?\s*(#.*)?$
  - id: jwt-decode-without-verification
    languages: [python]
    severity: ERROR
    message: >-
      Access tokens must be verified; use FOCA's `validate_token()` for
      tokens of callers
    patterns:
      - pattern-either:
          - pattern: '$JWT.$DECODE(..., options={..., "verify_signature": $OFF, ...}, ...)'
          - pattern: "$JWT.$DECODE(..., options=dict(..., verify_signature=$OFF, ...), ...)"
          - pattern: "$JWT.$DECODE(..., verify=$OFF, ...)"
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $OPTIONS = {..., "verify_signature": $OFF, ...}
                      ...
                  - pattern-inside: |
                      $OPTIONS = dict(..., verify_signature=$OFF, ...)
                      ...
              - pattern: $JWT.$DECODE(..., options=$OPTIONS, ...)
      # Falsy values, which PyJWT treats alike; patterns rather than a regex,
      # so that constants assigned before (e.g., `VERIFY = False`) match too
      - metavariable-pattern:
          metavariable: $OFF
          pattern-either:
            - pattern: "False"
            - pattern: "None"
            - pattern: "0"
            - pattern: "0.0"
            - pattern: '""'
      # `decode()` and `decode_complete()` of `jwt` and `jwt.PyJWT()` (also
      # imported under other names)
      - metavariable-regex:
          metavariable: $DECODE
          regex: ^decode(_complete)?$
  - id: jwt-decode-unsafe-algorithms
    languages: [python]
    severity: ERROR
    message: >-
      JWTs must be verified with a fixed list of signature algorithms: not
      with `none`, and not with the algorithm that the token's header names
    # Taint mode, so that values reach `algorithms` also through variables
    # (e.g., `alg = header["alg"]`) and collections. Taint is tracked within
    # a function only (not into helpers, nor from module constants into
    # functions). An `alg` from the header that is checked against an
    # allowlist is still reported: pass the allowlist itself instead
    mode: taint
    options:
      # Values looked up with a tainted key (e.g., `jwks[header["kid"]]`)
      # come from the server, not from the token
      taint_assume_safe_indexes: true
    pattern-sources:
      # The unverified header, and anything taken from it
      - pattern: jwt.get_unverified_header(...)
      # Any string literal `none`, in any case, but where it is removed from
      # a set of algorithms (not a sanitizer, which would also clear the
      # header's taint)
      - patterns:
          - pattern: '"=~/^[nN][oO][nN][eE]$/"'
          - pattern-not-inside: "$ALGORITHMS - {...}"
    pattern-sinks:
      - patterns:
          - pattern: $JWT.$DECODE(..., algorithms=$ALGORITHMS, ...)
          - metavariable-regex:
              metavariable: $DECODE
              regex: ^decode(_complete)?$
          - focus-metavariable: $ALGORITHMS
  - id: yaml-unsafe-load
    languages: [python]
    severity: ERROR
    message: >-
      Loading YAML with PyYAML's full or unsafe loader can instantiate
      arbitrary objects; use `yaml.safe_load()`
    pattern-either:
      - pattern: yaml.unsafe_load(...)
      - pattern: yaml.unsafe_load_all(...)
      - pattern: yaml.full_load(...)
      - pattern: yaml.full_load_all(...)
      - patterns:
          - pattern-either:
              - pattern: yaml.load_all(..., Loader=$LOADER, ...)
              - pattern: yaml.load_all($STREAM, $LOADER, ...)
          - metavariable-regex:
              metavariable: $LOADER
              regex: ^(yaml\.)?C?(Loader|UnsafeLoader|FullLoader)$
  - id: tls-verification-disabled
    languages: [python]
    severity: ERROR
    message: >-
      Certificate verification must not be disabled; configure a CA bundle
      instead (`verify` may name its path)
    # ruff flags `verify=False` in calls of the requests module, not
    # `verify=0`, and neither in calls on sessions (e.g., `session.get()`).
    # requests skips the check for any falsy `verify` but `None`, which
    # means the session's default
    patterns:
      - pattern-either:
          - pattern: $SESSION.verify = $OFF
          # Any function of the requests module
          - pattern: requests.$FUNCTION(..., verify=$OFF, ...)
          - patterns:
              - pattern: $X.$METHOD(..., verify=$OFF, ...)
              # The request methods of requests' sessions (and of the
              # module, and of similar clients)
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: ^(get|post|put|patch|delete|head|options|request|send)$
      - metavariable-pattern:
          metavariable: $OFF
          pattern-either:
            - pattern: "False"
            - pattern: "0"
            - pattern: '""'
